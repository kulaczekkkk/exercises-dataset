    // Dexie database
    const db = new Dexie('exercisesDemo');
    db.version(1).stores({
      exercises: '++id, name, category, bodyPart'
    });

    // Load exercises from local JSON
    async function loadExercises() {
      try {
        const response = await fetch('./data/exercises.json');
        const exercises = await response.json();
        await db.exercises.clear();
        for (const ex of exercises) {
          await db.exercises.add({
            name: ex.name,
            category: ex.category,
            bodyPart: ex.body_part
          });
        }
        renderExercises();
      } catch (err) {
        console.error('Failed to load exercises:', err));
        document.getElementById('exercises-grid').innerHTML = '<p class="text-red-500">Błąd ładowania danych.</p>';
      }
    }

    function renderExercises() {
      const grid = document.getElementById('exercises-grid');
      grid.innerHTML = '';
      db.exercises.each(ex => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow overflow-hidden hover:shadow-lg transition-shadow';
        const suffix = exerciseMap[ex.id] || '';
        const imgUrl = suffix ? `./images/${ex.id}-${suffix}.jpg` : './images/default.jpg';
        card.innerHTML = `
          <img src="${imgUrl}" alt="${ex.name}" class="w-full h-48 object-cover">
          <div class="p-4">
            <h3 class="font-semibold">${ex.name}</h3>
            <p class="text-sm text-gray-500">${ex.category} · ${ex.bodyPart}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Initialize
    loadExercises();
  </script>
