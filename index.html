  const dateVal = document.getElementById('direct-photo-date')?.value || toLocalIso(new Date());
  const weightVal = parseFloat(document.getElementById('direct-photo-weight')?.value) || 0;

  for (const file of files) {
    const dataUrl = await compressImageFileToDataUrl(file);
    await db.photos.add({
      date: dateVal,
      weight: weightVal,
      dataUrl
    });
  }
  openProgressPhotosModal();
}

async function deleteSinglePhoto(photoId) {
  if (!confirm('Usunąć to zdjęcie z aplikacji?')) return;
  await db.photos.delete(photoId);
  openProgressPhotosModal();
}

// ============================================================================
// WIDOK 4: KALENDARZ / HISTORIA
// ============================================================================
async function renderCalendarView() {
  const workouts = await db.workouts.toArray();
  workouts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

  const itemsHtml = workouts.map(w => {
    const exSummary = (w.exercises || []).map(e => {
      const workingSets = (e.sets || []).filter(s => (s.type || 'N') === 'N');
      const pool = workingSets.length ? workingSets : (e.sets || []);
      const best = pool.reduce((m, s) => (s.weight > m.weight ? s : m), { weight: 0, reps: 0 });
      return `<div class="flex justify-between text-xs py-0.5 text-gray-300"><span>${e.name}</span><span class="font-mono text-striveTeal">Top: ${best.weight}kg x ${best.reps}</span></div>`;
    }).join('');

    return `
      <div onclick="openPastWorkoutDetailModal(${w.id})" class="bg-bgCard rounded-3xl p-4 mb-3 cursor-pointer active:scale-[0.99] transition">
        <div class="flex justify-between items-center mb-2 border-b border-white/10 pb-2">
          <div><h3 class="font-bold text-base text-white">${w.routineName}</h3><span class="text-xs text-gray-400">📅 ${w.date} · Dotknij po mapę mięśni 🧬</span></div>
          <div class="text-right text-xs text-striveOrange font-bold"><div>∑ ${w.totalVolume} kg</div><div class="text-gray-400 font-normal">${w.durationMin} min · ${w.totalSets} serii</div></div>
        </div>
        <div class="space-y-0.5">${exSummary}</div>
      </div>`;
  }).join('');

  return `<div class="text-center pt-1 mb-4"><h1 class="text-lg font-bold">Historia Treningów</h1></div>${itemsHtml || '<p class="text-center text-xs text-gray-400 py-12">Brak zapisanych sesji treningowych.</p>'}`;
}

async function openPastWorkoutDetailModal(workoutId) {
  const w = await db.workouts.get(workoutId);
  if (!w) return;
  const allEx = await db.exercises.toArray();
  const exMap = Object.fromEntries(allEx.map(e => [e.id, e]));

  const enrichedExercises = (w.exercises || []).map(ex => ({
    ...ex,
    bodyPart: ex.bodyPart || (exMap[ex.exId] ? exMap[ex.exId].bodyPart : 'Klatka'),
    secondaryMuscles: (ex.secondaryMuscles && ex.secondaryMuscles.length) ? ex.secondaryMuscles : (exMap[ex.exId] ? exMap[ex.exId].secondaryMuscles : [])
  }));

  const setsHtml = enrichedExercises.map(ex => {
    const badges = (ex.sets || []).map(s => `<span class="inline-block bg-bgInput rounded-xl px-2.5 py-1 text-[11px] font-mono mr-1 mb-1">${s.type === 'R' ? '[R] ' : (s.type === 'D' ? '[D] ' : '')}${s.weight}kg x ${s.reps}</span>`).join('');
    return `<div class="py-2 border-b border-white/10 last:border-none"><div class="text-xs font-bold text-white mb-1">${ex.name}</div><div>${badges}</div></div>`;
  }).join('');

  openModal(`
    <div class="flex justify-between items-center mb-4">
      <button onclick="closeModal()" class="text-2xl">✕</button>
      <div class="text-center">
        <h2 class="text-base font-bold">${w.routineName}</h2>
        <span class="text-xs text-gray-400">${w.date} · ${w.durationMin} min · ${w.totalVolume} kg</span>
      </div>
      <div class="w-6"></div>
    </div>
    ${renderAnatomicalMuscleMap(enrichedExercises, '🧬 Mapa Mięśni z tego treningu', false)}
    <div class="bg-bgCard rounded-3xl p-4">${setsHtml}</div>
  `);
}

function openPlanWizard() {
  state.wizardPlan = {
    step: 1,
    name: '',
    desc: '',
    goal: 'Hipertrofia (budowanie mięśni)',
    startDate: toLocalIso(new Date()),
    endDate: '',
    calibrationWeek: false,
    days: ['pon.', 'śr.', 'pt.'],
    routineIds: [],
    progressionRule: 'Podwójna progresja'
  };
  renderPlanWizardStep();
}

async function renderPlanWizardStep() {
  const p = state.wizardPlan;
  const s = p.step;
  const routines = await db.routines.toArray();
  const titles = ['', 'Informacje', 'Struktura', 'Treningi', 'Progres', 'Podsumowanie'];

  const stepperHtml = `
    <div class="flex items-center justify-between px-2 mb-6">
      ${[1, 2, 3, 4, 5].map(n => `
        <div class="flex items-center ${n < 5 ? 'flex-1' : ''}">
          <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${n < s ? 'liquid-orange-btn text-white' : (n === s ? 'liquid-orange-btn text-white ring-4 ring-striveOrange/30' : 'border border-white/25 text-gray-400')}">${n < s ? '✓' : n}</div>
          ${n < 5 ? `<div class="flex-1 h-0.5 mx-1 ${n < s ? 'bg-striveOrange' : 'bg-white/15'}"></div>` : ''}
        </div>
      `).join('')}
    </div>`;

  let bodyHtml = '';
  if (s === 1) {
    bodyHtml = `
      <div class="space-y-4">
        <div><label class="text-sm font-bold block mb-1.5">Nazwa</label><input type="text" placeholder="Podaj nazwę (np. FBW 3x)" value="${p.name}" oninput="state.wizardPlan.name=this.value" class="w-full bg-bgInput rounded-2xl p-3 text-sm"></div>
        <div><label class="text-sm font-bold block mb-1.5">Opis</label><input type="text" placeholder="Wpisz opis" value="${p.desc}" oninput="state.wizardPlan.desc=this.value" class="w-full bg-bgInput rounded-2xl p-3 text-sm"></div>
        <div>
          <label class="text-sm font-bold block mb-1.5">Cel</label>
          <select onchange="state.wizardPlan.goal=this.value" class="w-full liquid-pill text-white font-semibold rounded-2xl p-3 text-sm">
            ${['Siła', 'Hipertrofia (budowanie mięśni)', 'Redukcja tkanki tłuszczowej', 'Ogólne zdrowie'].map(g => `<option ${p.goal === g ? 'selected' : ''}>${g}</option>`).join('')}
          </select>
        </div>
      </div>`;
  } else if (s === 2) {
    bodyHtml = `
      <div class="space-y-5">
        <div><label class="text-xs text-gray-300 block mb-1">📅 Od</label><input type="date" value="${p.startDate}" onchange="state.wizardPlan.startDate=this.value" class="bg-bgInput rounded-2xl p-2.5 text-sm"></div>
        <div><label class="text-xs text-gray-300 block mb-1">📅 Do (opcjonalnie)</label><input type="date" value="${p.endDate}" onchange="state.wizardPlan.endDate=this.value" class="bg-bgInput rounded-2xl p-2.5 text-sm"></div>
      </div>`;
  } else if (s === 3) {
    bodyHtml = `
      <div>
        <h3 class="font-bold text-base mb-2">Dni treningowe</h3>
        <div class="grid grid-cols-7 gap-1.5 mb-3">
          ${DAYS_SHORT.map(d => `<button onclick="toggleWizardDay('${d}')" class="h-14 rounded-2xl border text-xs font-semibold ${p.days.includes(d) ? 'liquid-orange-btn border-transparent text-white' : 'border-white/20 text-gray-300'}">${d}</button>`).join('')}
        </div>
        <div class="flex justify-between items-center mb-2">
          <h3 class="font-bold text-base">Przypisz rutyny do planu</h3>
          <button onclick="openRoutineCreatorModal()" class="text-xs text-striveOrange font-bold">+ Nowa rutyna</button>
        </div>
        <div class="space-y-2">
          ${routines.map(r => `
            <div class="flex justify-between items-center bg-bgCard p-3.5 rounded-2xl">
              <div>
                <div class="font-bold text-sm">${r.name}</div>
                <div class="text-xs text-striveTeal">${r.assignedDay ? `Dzień: ${r.assignedDay}` : 'Dowolny dzień'} · ${(r.exercises||[]).length} ćw.</div>
              </div>
              <button onclick="toggleWizardRoutine(${r.id})" class="px-3.5 py-1.5 rounded-xl text-xs font-bold ${p.routineIds.includes(r.id) ? 'liquid-orange-btn text-white' : 'liquid-pill text-white'}">${p.routineIds.includes(r.id) ? 'Wybrano ✓' : 'Wybierz'}</button>
            </div>`).join('')}
        </div>
      </div>`;
  } else if (s === 4) {
    const rules = ['Podwójna progresja', 'Liniowa', 'Cel powtórzeń', '5/3/1'];
    bodyHtml = `
      <div class="liquid-pill rounded-3xl p-4 text-xs text-gray-200 leading-relaxed mb-4">
        Wyniki każdego ćwiczenia są <strong>globalne dla całego planu</strong>. Po osiągnięciu limitu powtórzeń w seriach roboczych na ekranie podsumowania otrzymasz propozycję nowego ciężaru na kolejny trening.
      </div>
      <div class="flex flex-wrap gap-2 mb-6">${rules.map(rule => `<button onclick="state.wizardPlan.progressionRule='${rule}'; renderPlanWizardStep()" class="px-3.5 py-2 rounded-2xl border text-xs font-semibold ${p.progressionRule === rule ? 'liquid-orange-btn border-transparent text-white' : 'border-white/30 text-white'}">${rule}</button>`).join('')}</div>`;
  } else if (s === 5) {
    bodyHtml = `
      <div class="grid grid-cols-2 gap-4 text-sm bg-bgCard p-4 rounded-3xl">
        <div><div class="text-gray-400 text-xs">Nazwa</div><div class="font-bold">${p.name || 'Mój Plan'}</div></div>
        <div><div class="text-gray-400 text-xs">Cel</div><div class="font-bold">${p.goal}</div></div>
        <div><div class="text-gray-400 text-xs">Dni treningowe</div><div class="font-bold text-striveOrange">${p.days.join(', ') || 'Elastyczne'}</div></div>
        <div><div class="text-gray-400 text-xs">Progresja</div><div class="font-bold">${p.progressionRule}</div></div>
      </div>`;
  }

  openModal(`
    <div class="flex justify-between items-center mb-4">
      <button onclick="${s > 1 ? 'state.wizardPlan.step--; renderPlanWizardStep()' : 'closeModal()'}" class="text-xl">${s > 1 ? '←' : '✕'}</button>
      <h2 class="text-lg font-bold">${titles[s]}</h2><div class="w-6"></div>
    </div>
    ${stepperHtml}${bodyHtml}
    <button onclick="${s < 5 ? 'state.wizardPlan.step++; renderPlanWizardStep()' : 'savePlanFromWizard()'}" class="w-full liquid-orange-btn text-white font-bold py-3.5 rounded-3xl mt-8">${s < 5 ? 'Kontynuuj' : 'Utwórz plan'}</button>
  `);
}

function toggleWizardDay(d) {
  const arr = state.wizardPlan.days;
  const idx = arr.indexOf(d);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(d);
  renderPlanWizardStep();
}

function toggleWizardRoutine(rId) {
  const arr = state.wizardPlan.routineIds;
  const idx = arr.indexOf(rId);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(rId);
  renderPlanWizardStep();
}

async function savePlanFromWizard() {
  const p = state.wizardPlan;
  await db.plans.toCollection().modify({ active: 0 });
  await db.plans.add({
    name: p.name || 'Mój Plan',
    desc: p.desc,
    goal: p.goal,
    startDate: p.startDate || toLocalIso(new Date()),
    endDate: p.endDate || 'Zakończ ręcznie',
    days: p.days,
    routineIds: p.routineIds,
    progressionRule: p.progressionRule,
    active: 1,
    nextIndex: 0
  });
  closeModal();
  renderCurrentView();
}

async function openRecordsModal() {
  const workouts = await db.workouts.toArray();
  const maxMap = {};
  workouts.forEach(w => {
    (w.exercises || []).forEach(e => {
      (e.sets || []).filter(s => (s.type || 'N') === 'N').forEach(s => {
        const est1RM = Math.round(s.weight * (1 + s.reps / 30));
        if (!maxMap[e.name] || est1RM > maxMap[e.name].est1RM) maxMap[e.name] = { weight: s.weight, reps: s.reps, est1RM, date: w.date };
      });
    });
  });

  const rows = Object.entries(maxMap).map(([name, rec]) => `
    <div class="p-3.5 flex justify-between items-center">
      <div><div class="font-bold text-sm text-white">${name}</div><div class="text-xs text-gray-400">Top seria robocza: ${rec.weight}kg x ${rec.reps} (${rec.date})</div></div>
      <div class="text-right"><div class="text-sm font-bold text-striveOrange">~${rec.est1RM} kg</div><div class="text-[10px] text-gray-400">1RM</div></div>
    </div>
  `).join('');

  openModal(`<div class="flex justify-between items-center mb-4"><button onclick="closeModal()" class="text-2xl">✕</button><h2 class="text-lg font-bold">🏆 Rekordy (Serie robocze)</h2><div class="w-6"></div></div><div class="bg-bgCard rounded-3xl divide-y divide-white/10">${rows || '<p class="p-4 text-xs text-gray-400 text-center">Brak zapisanych rekordów.</p>'}</div>`);
}

async function exportFullBackup() {
  const data = {
    exercises: await db.exercises.toArray(),
    routines: await db.routines.toArray(),
    plans: await db.plans.toArray(),
    workouts: await db.workouts.toArray(),
    measurements: await db.measurements.toArray(),
    photos: await db.photos.toArray(),
    settings: await db.settings.toArray()
  };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gymWK_backup_${toLocalIso(new Date())}.json`;
  a.click();
}

function importFullBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      await db.transaction('rw', db.exercises, db.routines, db.plans, db.workouts, db.measurements, db.photos, db.settings, async () => {
        await db.exercises.clear(); await db.exercises.bulkAdd(data.exercises || []);
        await db.routines.clear(); await db.routines.bulkAdd(data.routines || []);
        await db.plans.clear(); await db.plans.bulkAdd(data.plans || []);
        await db.workouts.clear(); await db.workouts.bulkAdd(data.workouts || []);
        await db.measurements.clear(); await db.measurements.bulkAdd(data.measurements || []);
        await db.photos.clear(); await db.photos.bulkAdd(data.photos || []);
        await db.settings.clear(); await db.settings.bulkAdd(data.settings || []);
      });
      alert('Kopia zapasowa wgrana!');
      renderCurrentView();
    } catch (err) { alert('Błąd pliku.'); }
  };
  reader.readAsText(file);
}

// ============================================================================
// MODAL
// keepWorkoutUi = true tylko dla głównego widoku treningu (zostaje pasek z timerem i klawiatura)
// ============================================================================
function openModal(html, keepWorkoutUi = false) {
  if (!keepWorkoutUi) {
    closeKeypad();
    hideWorkoutTopbar();
  }
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  closeKeypad();
  hideWorkoutTopbar();
  document.getElementById('modal-overlay').classList.add('hidden');
}

window.addEventListener('DOMContentLoaded', async () => {
  // Dopasowanie odstępu treści modala do wysokości stałego paska (nagłówek + timer)
  const topbarEl = document.getElementById('workout-topbar');
  if (topbarEl && 'ResizeObserver' in window) {
    new ResizeObserver(() => syncOverlayTopPadding()).observe(topbarEl);
  }

  checkIosStandaloneMode();
  initBodyHighlighterAssets();
  navigate('home');
  await initCatalogOnly(false);
  restoreActiveWorkoutState();
});
