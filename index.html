<script>
// ============================================================================
// BAZA DANYCH I KONFIGURACJA GITHUB
// ============================================================================
const DAYS_SHORT = ['pon.', 'wt.', 'śr.', 'czw.', 'pt.', 'sob.', 'niedz.'];
const REPO_RAW = 'https://raw.githubusercontent.com/kulaczekkkk/exercises-dataset/main';
const ACTIVE_WORKOUT_STORAGE_KEY = 'gymWK_active_workout_autosave_v4';

const db = new Dexie('gymWK_GitHubPro_v18');
db.version(1).stores({
  exercises: '++id, name, category, bodyPart, slug, nextTargetWeight',
  routines: '++id, name, tag, assignedDay',
  plans: '++id, name, active',
  workouts: '++id, date, timestamp, routineId, routineName',
  measurements: '++id, date, weight',
  photos: '++id, date, weight, measurementId',
  settings: 'key'
});

let state = {
  tab: 'home',
  hubSubTab: 'plans',
  activeWorkout: null,
  pendingSummary: null,
  restTimerEnd: null,
  restTimerLabel: 'Przerwa',
  timerInterval: null,
  wizardPlan: null,
  routineDraft: null,
  pickerSelectedIds: [],
  pickerSupersetMode: false,
  selectedTodayRoutineId: null,
  tempMeasurementPhotos: [],
  exerciseFilterCat: 'ALL',
  exerciseFilterPart: 'ALL',
  exerciseSearch: '',
  exerciseDisplayLimit: 80,
  sharedAudioCtx: null,
  flashTimeout: null
};

// ============================================================================
// AUTO-ZAPIS TRENINGU W LOCIE
// ============================================================================
function persistActiveWorkoutState() {
  try {
    if (!state.activeWorkout) {
      localStorage.removeItem(ACTIVE_WORKOUT_STORAGE_KEY);
      return;
    }
    const payload = {
      activeWorkout: state.activeWorkout,
      restTimerEnd: state.restTimerEnd,
      restTimerLabel: state.restTimerLabel,
      savedAt: Date.now()
    };
    localStorage.setItem(ACTIVE_WORKOUT_STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    console.warn('Błąd zapisu:', e);
  }
}

function restoreActiveWorkoutState() {
  try {
    const raw = localStorage.getItem(ACTIVE_WORKOUT_STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && parsed.activeWorkout && Array.isArray(parsed.activeWorkout.exercises)) {
      state.activeWorkout = parsed.activeWorkout;
      state.restTimerLabel = parsed.restTimerLabel || 'Przerwa';
      if (parsed.restTimerEnd && parsed.restTimerEnd > Date.now()) {
        state.restTimerEnd = parsed.restTimerEnd;
      } else {
        state.restTimerEnd = null;
      }
      document.getElementById('active-workout-bar').classList.remove('hidden');
      document.getElementById('bar-routine-name').textContent = state.activeWorkout.routineName || 'Trwa trening';
      startGlobalWorkoutClock();
    }
  } catch (e) {
    console.warn('Błąd odzyskiwania:', e);
  }
}

// ============================================================================
// AUDIO I ALARM KOŃCA PRZERWY
// ============================================================================
function unlockIosAudioAndNotifications() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx && !state.sharedAudioCtx) state.sharedAudioCtx = new AudioCtx();
    if (state.sharedAudioCtx && state.sharedAudioCtx.state === 'suspended') state.sharedAudioCtx.resume();
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  } catch (e) {}
}
window.addEventListener('touchstart', unlockIosAudioAndNotifications, { passive: true });
window.addEventListener('click', unlockIosAudioAndNotifications, { passive: true });

function triggerRestFinishedAlert() {
  const overlay = document.getElementById('rest-flash-overlay');
  const barInner = document.getElementById('active-workout-bar-inner');
  if (overlay) {
    overlay.classList.remove('hidden');
    overlay.classList.add('rest-flash-active');
    if (state.flashTimeout) clearTimeout(state.flashTimeout);
    state.flashTimeout = setTimeout(() => { dismissRestAlarm(); }, 5500);
  }
  if (barInner) {
    barInner.classList.add('ring-4', 'ring-striveOrange', 'bg-striveOrange/30');
    setTimeout(() => { barInner.classList.remove('ring-4', 'ring-striveOrange', 'bg-striveOrange/30'); }, 4000);
  }

  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!state.sharedAudioCtx && AudioCtx) state.sharedAudioCtx = new AudioCtx();
    const ctx = state.sharedAudioCtx;
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      [587.33, 783.99, 987.77, 1174.66].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'triangle';
        gain.gain.setValueAtTime(0.35, ctx.currentTime + idx * 0.16);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.16 + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + idx * 0.16);
        osc.stop(ctx.currentTime + idx * 0.16 + 0.15);
      });
    }
  } catch (e) {}

  try {
    if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 400]);
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('🔔 Koniec przerwy!', { body: 'Czas wracać pod sztangę!' });
    }
  } catch (e) {}
}

function dismissRestAlarm() {
  const overlay = document.getElementById('rest-flash-overlay');
  if (overlay) {
    overlay.classList.add('hidden');
    overlay.classList.remove('rest-flash-active');
  }
}

// ============================================================================
// MAPA CIEPLNA MIĘŚNI (Z UWZGLĘDNIENIEM secondary_muscles)
// ============================================================================
function renderAnatomicalMuscleMap(exercisesList = []) {
  const partSets = {};
  exercisesList.forEach(ex => {
    const setsCount = (ex.sets || []).length;
    if (setsCount > 0) {
      const bp = ex.bodyPart || 'Klatka';
      partSets[bp] = (partSets[bp] || 0) + setsCount;
      if (Array.isArray(ex.secondaryMuscles)) {
        ex.secondaryMuscles.forEach(sec => {
          partSets[sec] = (partSets[sec] || 0) + (setsCount * 0.5);
        });
      }
    }
  });

  const getMuscleStyle = (...partNames) => {
    let total = 0;
    partNames.forEach(p => { total += (partSets[p] || 0); });
    if (total >= 4) return { fill: '#ff5500', cls: 'muscle-glow-heavy' };
    if (total >= 1) return { fill: '#ff9a3c', cls: 'muscle-glow-medium' };
    return { fill: '#222938', cls: '' };
  };

  const cChest = getMuscleStyle('Klatka');
  const cShoulders = getMuscleStyle('Barki');
  const cBiceps = getMuscleStyle('Bicepsy');
  const cForearms = getMuscleStyle('Przedramiona', 'Bicepsy');
  const cAbs = getMuscleStyle('Brzuch', 'Pas');
  const cQuads = getMuscleStyle('Czworogłowe ud', 'Przywodziciele ud');
  const cCalves = getMuscleStyle('Łydki');
  const cTraps = getMuscleStyle('Czworoboczny grzbietu', 'Plecy (Góra)', 'Kark');
  const cLats = getMuscleStyle('Najszerszy grzbietu', 'Plecy', 'Plecy (Góra)');
  const cLowerBack = getMuscleStyle('Prostowniki grzbietu', 'Najszerszy grzbietu');
  const cTriceps = getMuscleStyle('Tricepsy');
  const cGlutes = getMuscleStyle('Pośladki');
  const cHams = getMuscleStyle('Dwugłowe ud');

  const badgesHtml = Object.entries(partSets).map(([part, cnt]) => `
    <span class="inline-flex items-center gap-1.5 bg-white/5 border border-striveOrange/40 rounded-full px-3 py-1 text-xs font-bold text-white">
      <span class="w-2 h-2 rounded-full bg-striveOrange"></span>
      <span>${part}: <strong class="text-striveOrange">${Number.isInteger(cnt) ? cnt : cnt.toFixed(1)} s.</strong></span>
    </span>
  `).join('');

  return `
    <div class="bg-bgCard rounded-3xl p-4 mb-4">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-xs font-bold uppercase text-striveTeal">🧬 Cieplna Mapa Mięśni</h3>
        <div class="flex items-center gap-2 text-[10px] text-gray-400">
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#222938] inline-block"></span>0</span>
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#ff9a3c] inline-block"></span>1-3</span>
          <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#ff5500] inline-block"></span>4+ serii</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 items-center justify-items-center py-2">
        <!-- PRZÓD -->
        <div class="flex flex-col items-center">
          <span class="text-[10px] font-bold uppercase text-gray-400 mb-1">Przód</span>

function translateEquipmentToPolish(equipment = '') {
  const eq = String(equipment).toLowerCase().trim();
  const map = {
    'body weight': 'Masa ciała', 'barbell': 'Sztanga', 'dumbbell': 'Hantle',
    'cable': 'Wyciąg', 'kettlebell': 'Kettlebell', 'band': 'Taśma oporowa',
    'weighted': 'Obciążenie', 'stability ball': 'Piłka gimnastyczna',
    'ez barbell': 'Sztanga łamana EZ', 'leverage machine': 'Maszyna',
    'smith machine': 'Suwnica Smitha', 'assisted': 'Maszyna wspomagana'
  };
  if (map[eq]) return map[eq];
  if (eq.includes('machine') || eq.includes('leverage')) return 'Maszyna';
  if (eq.includes('cable')) return 'Wyciąg';
  if (eq.includes('dumbbell')) return 'Hantle';
  if (eq.includes('barbell')) return 'Sztanga';
  return equipment ? (equipment.charAt(0).toUpperCase() + equipment.slice(1)) : 'Inne';
}

function translateTargetToPolish(target = '', category = '') {
  const t = String(target).toLowerCase().trim();
  const c = String(category).toLowerCase().trim();
  const map = {
    'abs': 'Brzuch', 'waist': 'Brzuch', 'pectorals': 'Klatka', 'chest': 'Klatka',
    'biceps': 'Bicepsy', 'brachialis': 'Bicepsy', 'glutes': 'Pośladki', 'abductors': 'Pośladki',
    'delts': 'Barki', 'shoulders': 'Barki', 'triceps': 'Tricepsy', 'upper back': 'Plecy (Góra)',
    'lats': 'Najszerszy grzbietu', 'back': 'Najszerszy grzbietu', 'spine': 'Prostowniki grzbietu',
    'traps': 'Czworoboczny grzbietu', 'calves': 'Łydki', 'lower legs': 'Łydki',
    'quads': 'Czworogłowe ud', 'adductors': 'Przywodziciele ud', 'upper legs': 'Czworogłowe ud',
    'forearms': 'Przedramiona', 'hamstrings': 'Dwugłowe ud', 'cardiovascular system': 'Cardio'
  };
  return map[t] || map[c] || (target ? target.charAt(0).toUpperCase() + target.slice(1) : 'Inne');
}

function formatExerciseTitle(rawName = '') {
  return String(rawName).split(' ').map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : '').join(' ');
}

async function initCatalogOnly(forceReload = false) {
  const exCount = await db.exercises.count();
  if (exCount >= 1000 && !forceReload) return;

  const banner = document.getElementById('sync-banner');
  const bannerTxt = document.getElementById('sync-banner-text');
  if (banner) banner.classList.remove('hidden');

  try {
    let response = await fetch('data/exercises.json').catch(() => null);
    if (!response || !response.ok) {
      response = await fetch(`${REPO_RAW}/data/exercises.json`);
    }
    if (!response || !response.ok) throw new Error('Błąd pobierania');

    const exercisesData = await response.json();
    const existingList = await db.exercises.toArray();
    const existingMetaMap = {};
    existingList.forEach(old => {
      if (old.slug) existingMetaMap[old.slug] = { sessions: old.sessions || 0, nextTargetWeight: old.nextTargetWeight || null };
    });

    const catalog = exercisesData.map(ex => {
      const category = translateEquipmentToPolish(ex.equipment || '');
      const bodyPart = translateTargetToPolish(ex.target || '', ex.category || ex.body_part || '');
      const name = formatExerciseTitle(ex.name || 'Ćwiczenie');

      let tip = 'Kontroluj fazę opuszczania i pilnuj zakresu ruchu.';
      if (ex.instructions) {
        if (typeof ex.instructions.pl === 'string' && ex.instructions.pl.trim() !== '') {
          tip = ex.instructions.pl.trim();
        } else if (typeof ex.instructions.en === 'string' && ex.instructions.en.trim() !== '') {
          tip = ex.instructions.en.trim();
        }
      }

      const rawSec = Array.isArray(ex.secondary_muscles) ? ex.secondary_muscles : [];
      const secondaryMuscles = [...new Set(rawSec.map(m => translateTargetToPolish(m, '')))];

      const slug = String(ex.id || ex.slug || name.toLowerCase().replace(/[^a-z0-9]+/g, '_'));
      const cleanGifRel = (ex.gif_url || '').replace(/^\.?\//, '');
      const cleanImgRel = (ex.image || '').replace(/^\.?\//, '');

      const rawGifUrl = cleanGifRel ? `${REPO_RAW}/${cleanGifRel}` : '';
      const imageUrl = cleanImgRel ? `${REPO_RAW}/${cleanImgRel}` : '';
      const prevMeta = existingMetaMap[slug] || {};

      return {
        slug,
        name,
        category,
        bodyPart,
        secondaryMuscles,
        sessions: prevMeta.sessions || 0,
        nextTargetWeight: prevMeta.nextTargetWeight || null,
        tip,
        customGifUrl: rawGifUrl,
        imageUrl
      };
    });

    await db.exercises.clear();
    await db.exercises.bulkAdd(catalog);

    if (bannerTxt) bannerTxt.textContent = `✓ Załadowano ${catalog.length} ćwiczeń z bazy!`;
    setTimeout(() => { if (banner) banner.classList.add('hidden'); }, 1800);
    renderCurrentView();
  } catch (error) {
    console.error('Błąd:', error);
    if (banner) banner.classList.add('hidden');
  }
}

// ============================================================================
// NAWIGACJA
// ============================================================================
function navigate(tabName) {
  state.tab = tabName;
  document.querySelectorAll('nav button').forEach(btn => {
    btn.classList.remove('text-striveOrange');
    btn.classList.add('text-gray-300');
    const dot = btn.querySelector('.nav-dot');
    if (dot) dot.classList.add('hidden');
  });
  const activeBtn = document.getElementById('nav-' + tabName);
  if (activeBtn) {
    activeBtn.classList.remove('text-gray-300');
    activeBtn.classList.add('text-striveOrange');
    const dot = activeBtn.querySelector('.nav-dot');
    if (dot) dot.classList.remove('hidden');
  }

  const subnav = document.getElementById('workout-subnav');
  if (tabName === 'hub') {
    subnav.classList.remove('hidden');
    updateSubNavHighlight();
  } else {
    subnav.classList.add('hidden');
  }

  renderCurrentView();
}

function switchWorkoutSubTab(sub) {
  state.hubSubTab = sub;
  updateSubNavHighlight();
  renderCurrentView();
}

function updateSubNavHighlight() {
  ['plans', 'routines', 'exercises'].forEach(s => {
    const el = document.getElementById('subtab-' + s);
    if (state.hubSubTab === s) {
      el.className = 'py-2 rounded-xl liquid-pill text-white font-bold shadow transition';
    } else {
      el.className = 'py-2 rounded-xl text-gray-300 transition';
    }
  });
}

async function renderCurrentView() {
  const container = document.getElementById('app-content');
  if (state.tab === 'home') container.innerHTML = await renderHomeView();
  else if (state.tab === 'hub') {
    if (state.hubSubTab === 'plans') container.innerHTML = await renderPlansView();
    else if (state.hubSubTab === 'routines') container.innerHTML = await renderRoutinesView();
    else if (state.hubSubTab === 'exercises') container.innerHTML = await renderExercisesView();
  }
  else if (state.tab === 'profile') container.innerHTML = await renderProfileView();
  else if (state.tab === 'calendar') container.innerHTML = await renderCalendarView();
}

  const routines = await db.routines.toArray();
  const activePlan = await db.plans.where('active').equals(1).first();
  const noteObj = await db.settings.get('stickyNote');
  const stickyText = noteObj ? noteObj.value : 'Naciśnij aby edytować tekst';

  const latestWeight = measurements.length ? `${measurements[measurements.length - 1].weight} kg` : 'Brak wpisu';
  let weightDiffHtml = 'Dodaj pierwszy pomiar';
  if (measurements.length >= 2) {
    const firstW = measurements[0].weight;

  const workoutDates = new Set(workouts.map(w => w.date));
  let heatmapCells = '';
  const today = new Date();

  let weekRowHtml = '';

  }
}

    return `
      <div class="text-center py-14 px-4 bg-bgCard rounded-3xl mt-2">
        <h2 class="text-xl font-bold mb-2">Brak aktywnego planu</h2>
        <p class="text-xs text-gray-300 mb-6 leading-relaxed">Utwórz swoje rutyny w zakładce „Rutyny”, a następnie połącz je w Plan.</p>
        <div class="flex justify-center gap-3">
          <button onclick="switchWorkoutSubTab('routines')" class="liquid-pill text-white font-bold text-xs px-4 py-3 rounded-2xl">Przejdź do Rutyn</button>
          <button onclick="openPlanWizard()" class="liquid-orange-btn text-white font-bold text-xs px-5 py-3 rounded-2xl">+ Utwórz Plan</button>
        </div>
      </div>`;
  }

  const today = new Date();
  const todayShort = DAYS_SHORT[(today.getDay() + 6) % 7];
  const planRoutines = (activePlan.routineIds || []).map(id => routines.find(r => r.id === id)).filter(Boolean);

  let defaultRoutine = planRoutines.find(r => r.assignedDay === todayShort)
    || planRoutines[(activePlan.nextIndex || 0) % Math.max(1, planRoutines.length)]
    || routines[0];

  const selectedRoutine = routines.find(r => r.id === Number(state.selectedTodayRoutineId)) || defaultRoutine;

  const scheduleRow = DAYS_SHORT.map(d => {
    const isToday = d === todayShort;
    const assignedR = planRoutines.find(r => r.assignedDay === d);
    const isPlanDay = (activePlan.days || []).includes(d) || Boolean(assignedR);
    return `
      <div class="bg-bgCard border ${isToday ? 'border-striveOrange' : 'border-white/10'} rounded-2xl p-1.5 text-center">
        <div class="text-[10px] font-bold ${isToday ? 'text-striveOrange' : 'text-gray-400'}">${d}</div>
        <div class="text-[9px] mt-1 truncate ${isPlanDay ? 'text-striveTeal font-semibold' : 'text-gray-500'}">
          ${assignedR ? assignedR.name : (isPlanDay ? 'Trening' : 'Wolne')}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="flex justify-between items-center mb-4 pt-1">
      <button onclick="deletePlan(${activePlan.id})" class="text-xs text-gray-400">Usuń</button>
      <h1 class="text-lg font-bold">Aktywny Plan</h1>
      <button onclick="openPlanWizard()" class="liquid-pill text-white font-bold text-xs px-3.5 py-1.5 rounded-full">+ Nowy</button>
    </div>

    <div class="flex justify-between items-center mb-3">
      <div>
        <h2 class="text-2xl font-extrabold">${activePlan.name}</h2>
        <span class="text-xs text-gray-400">${activePlan.goal} · Globalna pamięć ciężarów</span>
      </div>
      <span class="liquid-pill text-xs px-3 py-1 rounded-full font-semibold">${activePlan.progressionRule || 'Podwójna progresja'}</span>
    </div>

    <p class="text-xs font-semibold text-gray-300 mb-1.5">Rozkład dni (Dziś: <span class="text-striveOrange">${todayShort} ${formatDayMonth(today)}</span>)</p>
    <div class="grid grid-cols-7 gap-1 mb-5">${scheduleRow}</div>

    <div class="bg-bgCard rounded-3xl p-4 mb-4">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold uppercase text-striveOrange">Wybierz trening na dziś:</span>
        <span class="text-[11px] text-gray-300">${selectedRoutine && selectedRoutine.assignedDay ? `Dzień: ${selectedRoutine.assignedDay}` : 'Elastyczny'}</span>
      </div>

      ${routines.length ? `
        <div class="flex flex-col gap-2.5">
          <select onchange="state.selectedTodayRoutineId = this.value; renderCurrentView()"
            class="w-full bg-bgInput rounded-2xl px-3.5 py-3 text-sm font-bold text-white focus:outline-none">
            ${routines.map(r => `
              <option value="${r.id}" ${selectedRoutine && selectedRoutine.id === r.id ? 'selected' : ''}>
                ${r.name} ${r.assignedDay ? `[Przypisany: ${r.assignedDay}]` : ''} (${(r.exercises || []).length} ćw.)
              </option>
            `).join('')}
          </select>

          <div class="flex gap-2">
            <button onclick="skipTodayRoutine(${activePlan.id})" class="flex-1 bg-white/10 text-white text-xs font-bold py-3 rounded-2xl active:scale-95 transition">Pomiń</button>
            <button onclick="startWorkout(${selectedRoutine.id})" class="flex-[2] liquid-orange-btn text-white text-sm font-bold py-3 rounded-2xl active:scale-95 transition">
              🏋️ Trenuj: ${selectedRoutine.name}
            </button>
          </div>
        </div>
      ` : `<p class="text-xs text-gray-400">Brak rutyn. Dodaj pierwszą rutynę w zakładce „Rutyny”.</p>`}
    </div>
  `;
}

async function skipTodayRoutine(planId) {
  const plan = await db.plans.get(planId);
  if (!plan) return;
  state.selectedTodayRoutineId = null;
  await db.plans.update(planId, { nextIndex: (plan.nextIndex || 0) + 1 });
  renderCurrentView();
}

async function deletePlan(planId) {
  if (confirm('Usunąć ten plan?')) {
    await db.plans.delete(planId);
    renderCurrentView();
  }
}

async function renderRoutinesView() {
  const routines = await db.routines.toArray();
  const exercises = await db.exercises.toArray();
  const exMap = Object.fromEntries(exercises.map(e => [e.id, e]));

  const emptyHtml = `
    <div class="text-center py-14 px-4 bg-bgCard rounded-3xl">
      <h3 class="text-base font-bold mb-1">Nie masz jeszcze żadnej rutyny</h3>
      <p class="text-xs text-gray-300 mb-4">Stwórz rutynę i dobierz ćwiczenia z bazy GIF-ów.</p>
      <button onclick="openRoutineCreatorModal()" class="liquid-orange-btn text-white text-xs font-bold px-5 py-3 rounded-2xl">+ Stwórz pierwszą rutynę</button>
    </div>`;

  let cardsHtml = routines.map(r => {
    const exListHtml = (r.exercises || []).map(item => {
      const ex = item.isPlaceholder ? { name: item.placeholderName } : exMap[item.exId];
      const setsArr = item.setsList || Array.from({ length: item.sets || 3 }, () => ({ type: 'N', reps: '8-10' }));
      const workingSets = setsArr.filter(s => (s.type || 'N') === 'N');
      const warmupCount = setsArr.filter(s => s.type === 'R').length;
      const dropCount = setsArr.filter(s => s.type === 'D').length;
      const repSample = workingSets[0] ? workingSets[0].reps : '8-10';
      const badgeSummary = `${warmupCount ? `${warmupCount}R+` : ''}${workingSets.length}x (${repSample})${dropCount ? `+${dropCount}D` : ''}`;

      return `
        <div class="flex justify-between items-start text-xs py-0.5 text-gray-200 gap-1">
          <span class="leading-tight">${item.superset ? '🔗 ' : ''}${ex ? ex.name : 'Ćwiczenie'}</span>
          <span class="text-striveTeal font-semibold shrink-0 text-[11px]">${badgeSummary}</span>
        </div>`;
    }).join('');

    return `
      <div class="bg-bgCard rounded-3xl p-3.5 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-start gap-1 mb-1">
            <div>
              <h3 class="font-bold text-sm leading-tight">${r.name}</h3>
              <span class="text-[10px] text-striveOrange font-semibold block">${r.assignedDay ? `📅 Dzień: ${r.assignedDay}` : '📅 Dowolny dzień'}</span>
              <span class="text-[10px] text-gray-400">⏱ R: ${r.warmupRestSec || 60}s · Robocza: ${r.workingRestSec || 120}s</span>
            </div>
            <button onclick="openRoutineActionsModal(${r.id})" class="bg-white/10 text-white px-2 py-0.5 rounded-xl text-xs font-bold">•••</button>
          </div>
          <div class="space-y-1 my-2 border-t border-white/10 pt-2">${exListHtml}</div>
        </div>
        <button onclick="startWorkout(${r.id})" class="w-full liquid-orange-btn text-white text-xs font-bold py-2.5 rounded-2xl mt-2 active:scale-95 transition">Trenuj</button>
      </div>`;
  }).join('');

  return `
    <div class="flex justify-between items-center mb-4 pt-1">
      <span class="text-striveTeal text-xs font-bold uppercase">Twoje zestawy</span>
      <h1 class="text-lg font-bold">Rutyny</h1>
      <button onclick="openRoutineCreatorModal()" class="liquid-orange-btn text-white text-xs font-bold px-3.5 py-1.5 rounded-full">Dodaj +</button>
    </div>
    ${routines.length ? `<div class="grid grid-cols-2 gap-2.5">${cardsHtml}</div>` : emptyHtml}
  `;
}

async function openRoutineActionsModal(routineId) {
  const r = await db.routines.get(routineId);
  if (!r) return;
  openModal(`
    <div class="flex justify-between items-center mb-5">
      <button onclick="closeModal()" class="text-2xl">✕</button>

async function duplicateRoutine(routineId) {
  const r = await db.routines.get(routineId);
  if (!r) return;
  const copy = { ...r, name: `${r.name} (Kopia)` };
  delete copy.id;
  await db.routines.add(copy);
  closeModal();
  renderCurrentView();
}

async function deleteRoutine(id) {
  if (confirm('Na pewno usunąć tę rutynę?')) {
    await db.routines.delete(id);
    closeModal();
    renderCurrentView();
  }
}

async function openRoutineCreatorModal(editRoutineId = null) {
  if (editRoutineId) {
    const existing = await db.routines.get(editRoutineId);
    const cloned = JSON.parse(JSON.stringify(existing));
    if (!cloned.warmupRestSec) cloned.warmupRestSec = 60;
    if (!cloned.workingRestSec) cloned.workingRestSec = 120;
    cloned.exercises = (cloned.exercises || []).map(item => {
      if (!item.setsList || !item.setsList.length) {
        item.setsList = Array.from({ length: item.sets || 3 }, () => ({
          type: 'N',
          reps: item.repsRange || '8-10',
          weight: ''
        }));
      }
      return item;
    });
    state.routineDraft = cloned;
  } else if (!state.routineDraft) {
    state.routineDraft = {
      id: null,
      name: '',
      tag: '',
      assignedDay: 'pon.',
      warmupRestSec: 60,
      workingRestSec: 120,
      desc: '',
      progression: 'Podwójna progresja',
      exercises: []
    };
  }
  await renderRoutineDraftModal();
}

              <div onclick="${exObj.id ? `openExerciseDetailFromDraft(${exObj.id})` : ''}" class="text-xs font-bold text-white truncate cursor-pointer hover:underline">${exIdx + 1}. ${exObj.name} <span class="text-[10px] text-striveTeal">(👁️ podgląd)</span></div>

            </div>

          <button onclick="addDraftSet(${exIdx}, 'N')" class="bg-striveTeal/25 border border-striveTeal/50 text-white text-[11px] font-bold py-1.5 rounded-xl">+ Dodaj serię</button>
          <button onclick="addDraftSet(${exIdx}, 'D')" class="bg-purple-500/15 border border-purple-400/40 text-purple-300 text-[11px] font-bold py-1.5 rounded-xl">+ Drop set (D)</button>

          <button onclick="openExercisePickerForDraft()" class="liquid-orange-btn text-white font-bold text-xs py-3.5 rounded-2xl">Dodaj ćwiczenia</button>

  const ex = await db.exercises.get(exId);

    <div class="flex justify-between items-center mb-4">
      <button onclick="openRoutineCreatorModal()" class="text-sm liquid-pill text-white font-bold px-3 py-1.5 rounded-xl">← Powrót do rutyny</button>

      <div class="w-10"></div>
    </div>

    <div class="bg-white rounded-3xl p-4 flex flex-col items-center justify-center mb-4 relative overflow-hidden">
      <span class="text-[10px] font-bold uppercase text-gray-500 mb-1">Podgląd animacji GIF</span>
      ${renderAnimatedExerciseThumb(ex, 'w-56 h-56')}
      <span class="text-xs font-semibold text-gray-700 mt-2">Sprzęt: ${ex.category} · Partia: ${ex.bodyPart}</span>
    </div>

    <div class="bg-bgCard rounded-3xl p-4 mb-4">
      <h3 class="text-xs font-bold uppercase text-striveOrange mb-1">Ściągawka z techniki (PL)</h3>
      <p class="text-xs text-gray-200 leading-relaxed">${ex.tip || 'Kontroluj fazę opuszczania i pilnuj zakresu ruchu.'}</p>
    </div>

    <button onclick="openRoutineCreatorModal()" class="w-full liquid-orange-btn text-white font-bold py-3.5 rounded-2xl text-sm">
      ✓ Zamknij podgląd i wróć do rutyny
    </button>
  `);
}

function applyRangeToAllWorkingSets(exIdx, newRange) {
  const list = state.routineDraft.exercises[exIdx].setsList || [];
  list.forEach(s => {
    if ((s.type || 'N') === 'N') s.reps = newRange;
  });
  renderRoutineDraftModal();
}

function cycleDraftSetType(exIdx, sIdx) {
  const s = state.routineDraft.exercises[exIdx].setsList[sIdx];
  s.type = nextSetType(s.type);
  renderRoutineDraftModal();
}

function addDraftSet(exIdx, setType = 'N') {
  const list = state.routineDraft.exercises[exIdx].setsList;
  const lastWorking = [...list].reverse().find(s => (s.type || 'N') === 'N') || list[list.length - 1] || { reps: '8-10' };
  list.push({
    type: setType,
    reps: lastWorking.reps || '8-10',
    weight: ''
  });
  renderRoutineDraftModal();
}

function removeDraftSet(exIdx, sIdx) {
  const list = state.routineDraft.exercises[exIdx].setsList;
  if (list.length <= 1) return;
  list.splice(sIdx, 1);
  renderRoutineDraftModal();
}

function moveDraftExercise(idx, dir) {
  const arr = state.routineDraft.exercises;
  const target = idx + dir;
  if (target < 0 || target >= arr.length) return;
  const temp = arr[idx];
  arr[idx] = arr[target];
  arr[target] = temp;
  renderRoutineDraftModal();
}

function removeDraftExercise(idx) {
  state.routineDraft.exercises.splice(idx, 1);
  renderRoutineDraftModal();
}

function addPlaceholderToDraft() {
  const name = prompt('Nazwa placeholdera:', 'Dowolne ćwiczenie');
  if (!name) return;
  state.routineDraft.exercises.push({
    isPlaceholder: true,
    placeholderName: name,
    setsList: [

async function startWorkout(routineId) {
  unlockIosAudioAndNotifications();
  const routine = await db.routines.get(routineId);
  if (!routine) return;
  const allExercises = await db.exercises.toArray();
  const exMap = Object.fromEntries(allExercises.map(e => [e.id, e]));

  const pastWorkouts = await db.workouts.toArray();
  pastWorkouts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

  const warmupRest = Number(routine.warmupRestSec) || 60;
  const workingRest = Number(routine.workingRestSec) || 120;

  const workoutExercises = (routine.exercises || []).map(item => {
    const exObj = item.isPlaceholder
      ? { id: 0, name: item.placeholderName, bodyPart: 'Klatka', isPlaceholder: true }
      : (exMap[item.exId] || { id: item.exId, name: 'Ćwiczenie', bodyPart: 'Klatka', slug: '0001' });

    let lastAllSets = [];
    if (!item.isPlaceholder) {
      for (const w of pastWorkouts) {
        const found = (w.exercises || []).find(e => Number(e.exId) === Number(item.exId));
        if (found && found.sets && found.sets.length) {
          lastAllSets = found.sets;
          break;
        }
      }
    }

    const lastWorkingSets = lastAllSets.filter(s => (s.type || 'N') === 'N');
    const lastWarmupSets = lastAllSets.filter(s => s.type === 'R');
    const lastDropSets = lastAllSets.filter(s => s.type === 'D');

    const templateSets = (item.setsList && item.setsList.length)
      ? item.setsList
      : Array.from({ length: item.sets || 3 }, () => ({ type: 'N', reps: item.repsRange || '8-10', weight: '' }));

    const plannedWorkingTemplates = templateSets.filter(t => (t.type || 'N') === 'N');
    const allWorkingHitMaxLastTime = lastWorkingSets.length >= plannedWorkingTemplates.length && plannedWorkingTemplates.every((wt, wIdx) => {
      const prevWork = lastWorkingSets[wIdx] || lastWorkingSets[lastWorkingSets.length - 1];
      const range = parseRepRange(wt.reps || '8-10');
      return prevWork && Number(prevWork.reps) >= range.max;
    });

    let workIdx = 0;
    let warmIdx = 0;
    let dropIdx = 0;

    const sets = templateSets.map((tmpl) => {
      const setType = tmpl.type || 'N';
      const range = parseRepRange(tmpl.reps || '8-10');

      if (setType !== 'N') {
        const prevPool = setType === 'R' ? lastWarmupSets : lastDropSets;
        const currPoolIdx = setType === 'R' ? warmIdx++ : dropIdx++;
        const prevSame = prevPool[currPoolIdx] || prevPool[prevPool.length - 1] || null;

        return {
          type: setType,
          repsRangeText: range.text,
          weight: prevSame ? prevSame.weight : (tmpl.weight || ''),
          reps: prevSame ? prevSame.reps : range.min,
          done: false,
          prevText: prevSame ? `${prevSame.weight}kg x ${prevSame.reps}` : '—',
          hintText: setType === 'R' ? `Rozgrzewka (${warmupRest}s)` : `Drop set (${warmupRest}s)`
        };
      }

      const prevWork = lastWorkingSets[workIdx] || lastWorkingSets[lastWorkingSets.length - 1] || null;
      workIdx++;

      const savedNextWeight = exObj.nextTargetWeight ? Number(exObj.nextTargetWeight) : null;

      if (!prevWork && !savedNextWeight) {
        return {
          type: 'N',
          repsRangeText: range.text,
          weight: tmpl.weight || '',
          reps: range.min,
          done: false,
          prevText: '—',
          hintText: `Cel: ${range.text} powt.`
        };
      }

      const prevDisplay = prevWork ? `${prevWork.weight}kg x ${prevWork.reps}` : '—';

      if (savedNextWeight) {
        return {
          type: 'N',
          repsRangeText: range.text,
          weight: savedNextWeight,
          reps: range.min,
          done: false,
          prevText: prevDisplay,
          hintText: `🔥 Nowy ciężar: ${savedNextWeight}kg x ${range.min}`
        };
      }

      if (allWorkingHitMaxLastTime) {
        const nextWeight = Number(prevWork.weight) + 2.5;
        return {
          type: 'N',
          repsRangeText: range.text,
          weight: nextWeight,
          reps: range.min,
          done: false,
          prevText: prevDisplay,
          hintText: `🔥 Progres: ${nextWeight}kg x ${range.min}`
        };
      }

      const nextReps = Math.min(range.max, Number(prevWork.reps) + 1);
      return {
        type: 'N',
        repsRangeText: range.text,
        weight: prevWork.weight,
        reps: nextReps,
        done: false,
        prevText: prevDisplay,
        hintText: `Cel: ${prevWork.weight}kg x ${nextReps}`
      };
    });

    return {
      exId: exObj.id,
      name: exObj.name,
      bodyPart: exObj.bodyPart,
      secondaryMuscles: exObj.secondaryMuscles || [],
      slug: exObj.slug,
      customGifUrl: exObj.customGifUrl,
      imageUrl: exObj.imageUrl,
      isPlaceholder: Boolean(item.isPlaceholder),
      superset: Boolean(item.superset),
      sets
    };
  });

  state.activeWorkout = {
    routineId: routine.id,
    routineName: routine.name,
    warmupRestSec: warmupRest,
    workingRestSec: workingRest,
    startTime: Date.now(),
    exercises: workoutExercises
  };

  persistActiveWorkoutState();
  document.getElementById('active-workout-bar').classList.remove('hidden');
  document.getElementById('bar-routine-name').textContent = routine.name;
  startGlobalWorkoutClock();
  openActiveWorkoutModal();
}

function discardActiveWorkout() {

  state.restTimerEnd = null;
  persistActiveWorkoutState();
  document.getElementById('active-workout-bar').classList.add('hidden');
  closeModal();
  renderCurrentView();
}

function cycleActiveWorkoutSetType(exIdx, sIdx) {
  const w = state.activeWorkout;
  const s = w.exercises[exIdx].sets[sIdx];
  s.type = nextSetType(s.type);
  if (s.type === 'R') s.hintText = `Rozgrzewka (${w.warmupRestSec}s)`;
  else if (s.type === 'D') s.hintText = `Drop set (${w.warmupRestSec}s)`;
  else s.hintText = `Cel (${s.repsRangeText || '8-10'})`;
  persistActiveWorkoutState();
  openActiveWorkoutModal();
}

function updateSetField(exIdx, sIdx, field, val) {
  if (!state.activeWorkout) return;
  state.activeWorkout.exercises[exIdx].sets[sIdx][field] = val === '' ? '' : (parseFloat(val) || 0);
  persistActiveWorkoutState();
}

function toggleSetDone(exIdx, sIdx) {
  unlockIosAudioAndNotifications();
  const w = state.activeWorkout;
  const s = w.exercises[exIdx].sets[sIdx];
  s.done = !s.done;
  if (s.done) {
    const isWarmup = s.type === 'R' || s.type === 'D';
    const sec = isWarmup ? (w.warmupRestSec || 60) : (w.workingRestSec || 120);
    const label = isWarmup ? 'Przerwa (Rozgrzewka)' : 'Przerwa (Seria robocza)';
    startRestTimer(sec, label);
  }
  persistActiveWorkoutState();
  openActiveWorkoutModal();
}

function addExtraSet(exIdx, setType = 'N') {
  const w = state.activeWorkout;
  const ex = w.exercises[exIdx];
  const last = ex.sets[ex.sets.length - 1] || { weight: '', reps: '', repsRangeText: '8-10', prevText: '—', hintText: '-' };
  ex.sets.push({
    ...last,
    type: setType,
    done: false,
    hintText: setType === 'R' ? `Rozgrzewka (${w.warmupRestSec}s)` : (setType === 'D' ? `Drop set (${w.warmupRestSec}s)` : `Cel (${last.repsRangeText || '8-10'})`)
  });
  persistActiveWorkoutState();
  openActiveWorkoutModal();
}

async function swapExerciseInFlight(exIdx, bodyPart) {
  const all = await db.exercises.toArray();
  const alternatives = all.slice(0, 40);
  const names = alternatives.map((a, i) => `${i + 1}. ${a.name} (${a.category})`).join('\n');
  const choice = prompt(`Wybierz numer ćwiczenia:\n\n${names}`);
  const idx = parseInt(choice) - 1;
  if (!isNaN(idx) && alternatives[idx]) {
    const picked = alternatives[idx];
    state.activeWorkout.exercises[exIdx].exId = picked.id;
    state.activeWorkout.exercises[exIdx].name = picked.name;
    state.activeWorkout.exercises[exIdx].bodyPart = picked.bodyPart;
    state.activeWorkout.exercises[exIdx].secondaryMuscles = picked.secondaryMuscles || [];
    state.activeWorkout.exercises[exIdx].slug = picked.slug;
    state.activeWorkout.exercises[exIdx].customGifUrl = picked.customGifUrl;
    state.activeWorkout.exercises[exIdx].isPlaceholder = false;
    persistActiveWorkoutState();
    openActiveWorkoutModal();
  }
}

function startRestTimer(seconds, label = 'Przerwa') {
  unlockIosAudioAndNotifications();
  dismissRestAlarm();
  state.restTimerEnd = Date.now() + seconds * 1000;
  state.restTimerLabel = label;
  persistActiveWorkoutState();
  updateRestTimerUI();
}

function adjustRestTimer(deltaSec) {
  if (!state.restTimerEnd) {
    startRestTimer(90 + deltaSec, 'Przerwa');
    return;
  }
  state.restTimerEnd += deltaSec * 1000;
  persistActiveWorkoutState();
  updateRestTimerUI();
}

function startGlobalWorkoutClock() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    if (!state.activeWorkout) return;
    const elapsedSec = Math.floor((Date.now() - state.activeWorkout.startTime) / 1000);
    const mm = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
    const ss = String(elapsedSec % 60).padStart(2, '0');
    const el = document.getElementById('bar-elapsed-time');
    if (el) el.textContent = `${mm}:${ss}`;
    updateRestTimerUI();
  }, 500);
}

function updateRestTimerUI() {
  const btn = document.getElementById('bar-timer-btn');
  const status = document.getElementById('bar-timer-status');
  if (!state.restTimerEnd) return;

  const rem = Math.ceil((state.restTimerEnd - Date.now()) / 1000);
  if (rem > 0) {
    const m = Math.floor(rem / 60);
    const s = String(rem % 60).padStart(2, '0');
    if (btn) btn.textContent = `⏱ ${m}:${s}`;
    if (status) status.textContent = `${state.restTimerLabel}: pozostało ${rem} s`;
  } else {
    state.restTimerEnd = null;
    persistActiveWorkoutState();
    if (btn) btn.textContent = `⏱ Gotowe!`;
    if (status) status.textContent = `🔔 KONIEC PRZERWY! Czas pod sztangę!`;
    triggerRestFinishedAlert();
  }
}

function prepareWorkoutSummaryModal() {
  const w = state.activeWorkout;
  if (!w) return;

  let totalSets = 0;
  let totalWorkingSets = 0;
  let totalVolume = 0;
  const cleanedExercises = [];
  const progressions = [];

  w.exercises.forEach(ex => {
    const doneSets = ex.sets.filter(s => s.done && (Number(s.weight) > 0 || Number(s.reps) > 0));
    const usedSets = doneSets.length ? doneSets : ex.sets.filter(s => Number(s.weight) > 0 || Number(s.reps) > 0);

    usedSets.forEach(s => {
      totalSets++;
      if ((s.type || 'N') === 'N') totalWorkingSets++;
      totalVolume += (Number(s.weight) || 0) * (Number(s.reps) || 0);
    });

    if (usedSets.length) {
      cleanedExercises.push({
        exId: ex.exId,
        name: ex.name,
        bodyPart: ex.bodyPart || 'Klatka',
        secondaryMuscles: ex.secondaryMuscles || [],
        sets: usedSets.map(s => ({
          type: s.type || 'N',
          weight: Number(s.weight) || 0,
          reps: Number(s.reps) || 0,
          repsRangeText: s.repsRangeText || '8-10'
        }))
      });

      const workingUsed = usedSets.filter(s => (s.type || 'N') === 'N');
      if (workingUsed.length > 0 && ex.exId) {
        const hitLimitAll = workingUsed.every(ws => {
          const parsed = parseRepRange(ws.repsRangeText || '8-10');
          return Number(ws.reps) >= parsed.max;
        });

        const topWorkingWeight = Math.max(...workingUsed.map(ws => Number(ws.weight) || 0));
        const sampleRange = parseRepRange(workingUsed[0].repsRangeText || '8-10');

        if (hitLimitAll && topWorkingWeight > 0) {
          progressions.push({
            exId: ex.exId,
            name: ex.name,
            currentWeight: topWorkingWeight,
            achievedRepsText: workingUsed.map(ws => `${ws.weight}kg×${ws.reps}`).join(', '),
            limitMax: sampleRange.max,
            proposedWeight: topWorkingWeight + 2.5
          });
        }
      }
    }
  });

  const durationMin = Math.max(1, Math.round((Date.now() - w.startTime) / 60000));

  state.pendingSummary = {
    date: toLocalIso(new Date()),
    timestamp: Date.now(),
    routineId: w.routineId,
    routineName: w.routineName,
    durationMin,
    totalSets,
    totalWorkingSets,
    totalVolume: Math.round(totalVolume),
    exercises: cleanedExercises,
    progressions
  };

  renderWorkoutSummaryModal();
}

function adjustProposedWeight(idx, delta) {
  const p = state.pendingSummary.progressions[idx];
  p.proposedWeight = Math.max(0, Number(p.proposedWeight) + delta);
  renderWorkoutSummaryModal();
}

async function confirmAndSaveWorkoutSummary() {
  const sum = state.pendingSummary;
  if (!sum) return;

  await db.workouts.add({
    date: sum.date,
    timestamp: sum.timestamp,
    routineId: sum.routineId,
    routineName: sum.routineName,
    durationMin: sum.durationMin,
    totalSets: sum.totalSets,
    totalVolume: sum.totalVolume,
    exercises: sum.exercises
  });

  const progressedIds = new Set();
  for (const prog of sum.progressions) {
    if (prog.exId && prog.proposedWeight > 0) {
      progressedIds.add(prog.exId);
      const dbEx = await db.exercises.get(prog.exId);
      if (dbEx) {
        await db.exercises.update(prog.exId, {
          nextTargetWeight: prog.proposedWeight,
          sessions: (dbEx.sessions || 0) + 1
        });
      }
    }
  }

  for (const ex of sum.exercises) {
    if (ex.exId && !progressedIds.has(ex.exId)) {
      const dbEx = await db.exercises.get(ex.exId);
      if (dbEx) {
        await db.exercises.update(ex.exId, {
          nextTargetWeight: null,
          sessions: (dbEx.sessions || 0) + 1
        });
      }
    }
  }

  const activePlan = await db.plans.where('active').equals(1).first();
  if (activePlan) {
    await db.plans.update(activePlan.id, { nextIndex: (activePlan.nextIndex || 0) + 1 });
  }

  state.activeWorkout = null;
  state.pendingSummary = null;
  state.restTimerEnd = null;
  state.selectedTodayRoutineId = null;
  persistActiveWorkoutState();
  document.getElementById('active-workout-bar').classList.add('hidden');
  closeModal();
  navigate('home');
}

        </div>
      </button>
    </div>

    <p class="text-xs text-gray-400 mb-2 pl-1">Narzędzia i raportowanie</p>
    <div class="bg-bgCard rounded-3xl divide-y divide-white/10 mb-6">
      <button onclick="openCoachReportModal()" class="w-full p-4 flex items-center justify-between text-sm font-bold text-striveTeal">
        <span class="flex items-center gap-3">📄 Raport dla trenera (Kopiuj / PDF)</span><span class="text-gray-400">›</span>
      </button>
      <button onclick="openRecordsModal()" class="w-full p-4 flex items-center justify-between text-sm font-medium">
        <span class="flex items-center gap-3">🏆 Rekordy treningowe (Serie robocze)</span><span class="text-gray-400">›</span>
      </button>
      <button onclick="initCatalogOnly(true)" class="w-full p-4 flex items-center justify-between text-sm font-medium text-gray-200">
        <span class="flex items-center gap-3">🔄 Przeładuj katalog z GitHuba (${exCount} ćw.)</span><span class="text-gray-400">›</span>
      </button>
      <button onclick="exportFullBackup()" class="w-full p-4 flex items-center justify-between text-sm font-medium text-striveOrange">
        <span class="flex items-center gap-3">☁️ Eksportuj kopię zapasową (.JSON)</span><span class="text-gray-400">›</span>
      </button>
      <label class="w-full p-4 flex items-center justify-between text-sm font-medium cursor-pointer">
        <span class="flex items-center gap-3">🔄 Przywróć kopię zapasową z pliku</span>
        <input type="file" accept=".json" onchange="importFullBackup(event)" class="hidden">
        <span class="text-gray-400">›</span>
      </label>
      <button onclick="clearAllUserData()" class="w-full p-4 flex items-center justify-between text-sm font-medium text-red-400">
        <span class="flex items-center gap-3">🗑 Wyczyść historię i pomiary (Reset do zera)</span><span class="text-gray-400">›</span>
      </button>
    </div>
  `;
}

async function openCoachReportModal() {
  const workouts = await db.workouts.toArray();
  workouts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  const measurements = await db.measurements.orderBy('date').reverse().toArray();
  const latestM = measurements[0];
  const prevM = measurements[1];

  let reportText = `=== RAPORT TRENINGOWY GYMWK (${toLocalIso(new Date())}) ===\n\n`;
  reportText += `1. POMIARY SYLWETKI I WAGA:\n`;
  if (latestM) {
    const wDiff = prevM ? ` (${(latestM.weight - prevM.weight >= 0 ? '+' : '')}${(latestM.weight - prevM.weight).toFixed(1)} kg vs ${prevM.date})` : '';
    reportText += `• Data pomiaru: ${latestM.date}\n• Aktualna waga: ${latestM.weight} kg${wDiff}\n\n`;
  } else {
    reportText += `• Brak pomiarów.\n\n`;
  }

  openModal(`
    <div class="flex justify-between items-center mb-4 no-print">
      <button onclick="closeModal()" class="text-2xl">✕</button>
      <h2 class="text-lg font-bold">📄 Raport dla trenera</h2>
      <div class="w-6"></div>
    </div>
    <textarea id="coach-report-area" rows="14" readonly class="w-full bg-bgCard rounded-3xl p-4 text-xs font-mono text-gray-200 leading-relaxed mb-4">${reportText}</textarea>
    <button onclick="copyCoachReportText()" class="w-full liquid-orange-btn text-white font-bold py-3.5 rounded-2xl text-xs">📋 Kopiuj raport</button>
  `);
}

function copyCoachReportText() {
  const area = document.getElementById('coach-report-area');
  if (!area) return;
  navigator.clipboard.writeText(area.value).then(() => alert('Skopiowano raport!'));
}

async function openMeasurementsModal() {
  state.tempMeasurementPhotos = [];
  await renderMeasurementsModalContent();
}

async function renderMeasurementsModalContent() {
  const list = await db.measurements.orderBy('date').reverse().toArray();
  const latest = list[0] || { weight: '', chest: '', waist: '' };
  const tempThumbsHtml = state.tempMeasurementPhotos.map((dataUrl, idx) => `
    <div class="relative w-16 h-16 rounded-2xl overflow-hidden border border-striveOrange">
      <img src="${dataUrl}" class="w-full h-full object-cover">
      <button onclick="state.tempMeasurementPhotos.splice(${idx},1); renderMeasurementsModalContent()" class="absolute top-0.5 right-0.5 bg-black/70 text-white text-[10px] w-4 h-4 rounded-full">✕</button>
    </div>
  `).join('');

  openModal(`
    <div class="flex justify-between items-center mb-4">
      <button onclick="closeModal()" class="text-2xl">✕</button>
      <h2 class="text-lg font-bold">Dziennik pomiarów</h2>
      <div class="w-6"></div>
    </div>
    <div class="bg-bgCard rounded-3xl p-4 mb-4 space-y-3">
      <div class="grid grid-cols-3 gap-2">
        <div><label class="text-[11px] text-gray-300">Waga (kg)</label><input id="m-weight" type="number" step="0.1" value="${latest.weight}" class="w-full bg-bgInput rounded-2xl p-2 text-center font-bold"></div>
        <div><label class="text-[11px] text-gray-300">Klatka (cm)</label><input id="m-chest" type="number" step="0.5" value="${latest.chest}" class="w-full bg-bgInput rounded-2xl p-2 text-center font-bold"></div>
        <div><label class="text-[11px] text-gray-300">Pas (cm)</label><input id="m-waist" type="number" step="0.5" value="${latest.waist}" class="w-full bg-bgInput rounded-2xl p-2 text-center font-bold"></div>
      </div>
      <div class="border-t border-white/10 pt-3">
        <label class="text-xs font-bold text-striveOrange block mb-2">📷 Zdjęcia sylwetki (${state.tempMeasurementPhotos.length})</label>
        ${tempThumbsHtml ? `<div class="flex flex-wrap gap-2 mb-2.5">${tempThumbsHtml}</div>` : ''}
        <div class="grid grid-cols-2 gap-2">
          <label class="liquid-pill text-white text-center text-xs font-bold py-3 rounded-2xl cursor-pointer">
            📷 Aparat
            <input type="file" accept="image/*" capture="environment" onchange="attachPhotoToMeasurementDraft(event)" class="hidden">
          </label>
          <label class="liquid-pill text-white text-center text-xs font-bold py-3 rounded-2xl cursor-pointer">
            🖼️ Galeria
            <input type="file" accept="image/*" multiple onchange="attachPhotoToMeasurementDraft(event)" class="hidden">
          </label>
        </div>
      </div>
      <button onclick="saveMeasurement()" class="w-full liquid-orange-btn text-white font-bold py-3 rounded-2xl">Zapisz pomiar</button>
    </div>
  `);
}

async function attachPhotoToMeasurementDraft(event) {
  const files = Array.from(event.target.files || []);
  for (const file of files) {
    const dataUrl = await compressImageFileToDataUrl(file);
    state.tempMeasurementPhotos.push(dataUrl);
  }
  renderMeasurementsModalContent();
}

async function saveMeasurement() {
  const wVal = parseFloat(document.getElementById('m-weight').value);
  if (!wVal) return alert('Podaj wagę');
  const todayIso = toLocalIso(new Date());
  const photosCopy = [...state.tempMeasurementPhotos];

  await db.measurements.add({
    date: todayIso,
    weight: wVal,
    chest: parseFloat(document.getElementById('m-chest').value) || 0,
    waist: parseFloat(document.getElementById('m-waist').value) || 0,
    photos: photosCopy
  });

  for (const dataUrl of photosCopy) {
    await db.photos.add({ date: todayIso, weight: wVal, dataUrl });
  }

  state.tempMeasurementPhotos = [];
  closeModal();
  renderCurrentView();
}

async function openBodyProgressModal() {
  const list = await db.measurements.orderBy('date').toArray();
  if (!list.length) return alert('Brak pomiarów');
  const first = list[0];
  const last = list[list.length - 1];
  openModal(`
    <div class="flex justify-between items-center mb-4"><button onclick="closeModal()" class="text-2xl">✕</button><h2 class="text-lg font-bold">Progres</h2><div class="w-6"></div></div>
    <div class="bg-bgCard rounded-3xl p-4 text-sm">Waga: ${first.weight} → ${last.weight} kg</div>
  `);
}

async function openProgressPhotosModal() {
  const photos = await db.photos.orderBy('date').reverse().toArray();
  const gridHtml = photos.map(p => `
    <div class="bg-bgCard rounded-3xl p-2 relative">
      <img src="${p.dataUrl}" class="w-full h-40 object-cover rounded-2xl mb-1">
      <div class="text-xs text-center">${p.date} · ${p.weight}kg</div>
    </div>`).join('');
  openModal(`
    <div class="flex justify-between items-center mb-4"><button onclick="closeModal()" class="text-2xl">✕</button><h2 class="text-lg font-bold">Galeria</h2><div class="w-6"></div></div>
    <div class="grid grid-cols-2 gap-2">${gridHtml || '<p class="text-xs text-gray-400">Brak zdjęć.</p>'}</div>
  `);
}

async function renderCalendarView() {
  const workouts = await db.workouts.toArray();
  workouts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

  const itemsHtml = workouts.map(w => `
    <div onclick="openPastWorkoutDetailModal(${w.id})" class="bg-bgCard rounded-3xl p-4 mb-3 cursor-pointer active:scale-[0.99] transition">
      <div class="flex justify-between items-center mb-1">
        <h3 class="font-bold text-base text-white">${w.routineName}</h3>
        <span class="text-xs text-striveOrange font-bold">∑ ${w.totalVolume} kg</span>
      </div>
      <div class="text-xs text-gray-400">📅 ${w.date} · ⏱ ${w.durationMin} min · ${w.totalSets} serii (Dotknij po mapę mięśni 🧬)</div>
    </div>`).join('');

  return `<div class="text-center pt-1 mb-4"><h1 class="text-lg font-bold">Historia Treningów</h1></div>${itemsHtml || '<p class="text-center text-xs text-gray-400 py-12">Brak zapisanych sesji.</p>'}`;
}

async function openPastWorkoutDetailModal(workoutId) {
  const w = await db.workouts.get(workoutId);
  if (!w) return;
  const allEx = await db.exercises.toArray();
  const exMap = Object.fromEntries(allEx.map(e => [e.id, e]));

  const enrichedExercises = (w.exercises || []).map(ex => ({
    ...ex,
    bodyPart: ex.bodyPart || (exMap[ex.exId] ? exMap[ex.exId].bodyPart : 'Klatka'),
    secondaryMuscles: exMap[ex.exId] ? exMap[ex.exId].secondaryMuscles : []
  }));

  const setsHtml = enrichedExercises.map(ex => {
    const badges = (ex.sets || []).map(s => `<span class="inline-block bg-bgInput rounded-xl px-2.5 py-1 text-[11px] font-mono mr-1 mb-1">${s.weight}kg x ${s.reps}</span>`).join('');
    return `<div class="py-2 border-b border-white/10 last:border-none"><div class="text-xs font-bold text-white mb-1">${ex.name}</div><div>${badges}</div></div>`;
  }).join('');

  openModal(`
    <div class="flex justify-between items-center mb-4">
      <button onclick="closeModal()" class="text-2xl">✕</button>
      <div class="text-center"><h2 class="text-base font-bold">${w.routineName}</h2><span class="text-xs text-gray-400">${w.date}</span></div>
      <div class="w-6"></div>
    </div>
    ${renderAnatomicalMuscleMap(enrichedExercises)}
    <div class="bg-bgCard rounded-3xl p-4">${setsHtml}</div>
  `);
}

async function openRecordsModal() {
  const workouts = await db.workouts.toArray();
  const maxMap = {};
  workouts.forEach(w => {
    (w.exercises || []).forEach(e => {
      (e.sets || []).filter(s => (s.type || 'N') === 'N').forEach(s => {
        const est1RM = Math.round(s.weight * (1 + s.reps / 30));
        if (!maxMap[e.name] || est1RM > maxMap[e.name].est1RM) maxMap[e.name] = { weight: s.weight, reps: s.reps, est1RM, date: w.date };
      });
    });
  });
  const rows = Object.entries(maxMap).map(([name, rec]) => `
    <div class="p-3.5 flex justify-between items-center">
      <div><div class="font-bold text-sm text-white">${name}</div><div class="text-xs text-gray-400">Top: ${rec.weight}kg x ${rec.reps} (${rec.date})</div></div>
      <div class="text-sm font-bold text-striveOrange">~${rec.est1RM} kg 1RM</div>
    </div>`).join('');
  openModal(`<div class="flex justify-between items-center mb-4"><button onclick="closeModal()" class="text-2xl">✕</button><h2 class="text-lg font-bold">🏆 Rekordy</h2><div class="w-6"></div></div><div class="bg-bgCard rounded-3xl divide-y divide-white/10">${rows || '<p class="p-4 text-xs text-gray-400 text-center">Brak rekordów.</p>'}</div>`);
}

async function exportFullBackup() {
  const data = {
    exercises: await db.exercises.toArray(),
    routines: await db.routines.toArray(),
    plans: await db.plans.toArray(),
    workouts: await db.workouts.toArray(),
    measurements: await db.measurements.toArray(),
    photos: await db.photos.toArray(),
    settings: await db.settings.toArray()
  };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gymWK_backup_${toLocalIso(new Date())}.json`;
  a.click();
}

function importFullBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      await db.transaction('rw', db.exercises, db.routines, db.plans, db.workouts, db.measurements, db.photos, db.settings, async () => {
        await db.exercises.clear(); await db.exercises.bulkAdd(data.exercises || []);
        await db.routines.clear(); await db.routines.bulkAdd(data.routines || []);
        await db.plans.clear(); await db.plans.bulkAdd(data.plans || []);
        await db.workouts.clear(); await db.workouts.bulkAdd(data.workouts || []);
        await db.measurements.clear(); await db.measurements.bulkAdd(data.measurements || []);
        await db.photos.clear(); await db.photos.bulkAdd(data.photos || []);
        await db.settings.clear(); await db.settings.bulkAdd(data.settings || []);
      });
      alert('Wgrano kopię zapasową!');
      renderCurrentView();
    } catch (err) { alert('Błąd pliku'); }
  };
  reader.readAsText(file);
}

function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

window.addEventListener('DOMContentLoaded', async () => {
  checkIosStandaloneMode();
  navigate('home');
  await initCatalogOnly(false);
  restoreActiveWorkoutState();
});
</script>
