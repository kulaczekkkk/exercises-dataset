<script>
// ============================================================================
// BAZA DANYCH I KONFIGURACJA GITHUB
// ============================================================================
const DAYS_SHORT = ['pon.', 'wt.', 'śr.', 'czw.', 'pt.', 'sob.', 'niedz.'];
const REPO_RAW = 'https://raw.githubusercontent.com/kulaczekkkk/exercises-dataset/main';
const RN_BODY_CDN = 'https://cdn.jsdelivr.net/npm/react-native-body-highlighter@3.2.0/dist';
const ACTIVE_WORKOUT_STORAGE_KEY = 'gymWK_active_workout_autosave_v6';
const RN_BODY_CACHE_KEY = 'gymWK_rn_body_highlighter_v320';

const db = new Dexie('gymWK_GitHubPro_v20');
db.version(1).stores({
  exercises: '++id, name, category, bodyPart, slug, nextTargetWeight',
  routines: '++id, name, tag, assignedDay',
  plans: '++id, name, active',
  workouts: '++id, date, timestamp, routineId, routineName',
  measurements: '++id, date, weight',
  photos: '++id, date, weight, measurementId',
  settings: 'key'
});

let state = {
  tab: 'home',
  hubSubTab: 'plans',
  activeWorkout: null,
  pendingSummary: null,
  restTimerEnd: null,
  restTimerTotal: null,
  restTimerLabel: 'Przerwa',
  timerInterval: null,
  wizardPlan: null,
  routineDraft: null,
  pickerSelectedIds: [],
  pickerSupersetMode: false,
  pickerScrollTop: 0,
  selectedTodayRoutineId: null,
  tempMeasurementPhotos: [],
  exerciseFilterCat: 'ALL',
  exerciseFilterPart: 'ALL',
  exerciseSearch: '',
  exerciseDisplayLimit: 80,
  sharedAudioCtx: null,
  flashTimeout: null,
  rnBodyAssets: null,
  kbd: null
};

// ============================================================================
// ŁADOWANIE ORYGINALNYCH ŚCIEŻEK SVG Z REACT-NATIVE-BODY-HIGHLIGHTER (v3.2.0)
// ============================================================================
async function initBodyHighlighterAssets() {
  try {
    const cached = localStorage.getItem(RN_BODY_CACHE_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed && Array.isArray(parsed.front) && Array.isArray(parsed.back) && parsed.front.length > 5) {
        state.rnBodyAssets = parsed;
        return;
      }
    }

    const evalCommonJs = (code) => {
      const exports = {};
      const module = { exports };
      new Function('exports', 'module', code)(exports, module);
      return module.exports || exports;
    };

    const [frontRes, backRes, wrapperRes] = await Promise.all([
      fetch(`${RN_BODY_CDN}/assets/bodyFront.js`),
      fetch(`${RN_BODY_CDN}/assets/bodyBack.js`),
      fetch(`${RN_BODY_CDN}/components/SvgMaleWrapper.js`).catch(() => null)
    ]);

    if (!frontRes.ok || !backRes.ok) return;

    const frontCode = await frontRes.text();
    const backCode = await backRes.text();
    const frontMod = evalCommonJs(frontCode);
    const backMod = evalCommonJs(backCode);

    let borderFront = [];
    let borderBack = [];
    if (wrapperRes && wrapperRes.ok) {
      const wrapText = await wrapperRes.text();
      const dMatches = [...wrapText.matchAll(/d:\s*["']([^"']+)["']/g)].map(m => m[1]);
      if (dMatches.length >= 2) {
        borderFront = [dMatches[0]];
        borderBack = [dMatches[1]];
      } else if (dMatches.length === 1) {
        borderFront = [dMatches[0]];
      }
    }

    if (Array.isArray(frontMod.bodyFront) && Array.isArray(backMod.bodyBack)) {
      state.rnBodyAssets = {
        front: frontMod.bodyFront,
        back: frontMod.bodyBack ? frontMod.bodyBack : backMod.bodyBack,
        borderFront,
        borderBack
      };
      try {
        localStorage.setItem(RN_BODY_CACHE_KEY, JSON.stringify(state.rnBodyAssets));
      } catch (e) {}
      if (state.tab === 'home') renderCurrentView();
    }
  } catch (err) {
    console.warn('Używam wbudowanego modelu SVG sylwetki:', err);
  }
}

// ============================================================================
// AUTO-ZAPIS TRENINGU W LOCIE
// ============================================================================
function persistActiveWorkoutState() {
  try {
    if (!state.activeWorkout) {
      localStorage.removeItem(ACTIVE_WORKOUT_STORAGE_KEY);
      return;
    }
    const payload = {
      activeWorkout: state.activeWorkout,
      restTimerEnd: state.restTimerEnd,
      restTimerTotal: state.restTimerTotal,
      restTimerLabel: state.restTimerLabel,
      savedAt: Date.now()
    };
    localStorage.setItem(ACTIVE_WORKOUT_STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    console.warn('Błąd zapisu:', e);
  }
}

function restoreActiveWorkoutState() {
  try {
    const raw = localStorage.getItem(ACTIVE_WORKOUT_STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && parsed.activeWorkout && Array.isArray(parsed.activeWorkout.exercises)) {
      state.activeWorkout = parsed.activeWorkout;
      state.restTimerLabel = parsed.restTimerLabel || 'Przerwa';
      state.restTimerTotal = parsed.restTimerTotal || null;
      if (parsed.restTimerEnd && parsed.restTimerEnd > Date.now()) {
        state.restTimerEnd = parsed.restTimerEnd;
      } else {
        state.restTimerEnd = null;
      }
      document.getElementById('active-workout-bar').classList.remove('hidden');
      document.getElementById('bar-routine-name').textContent = state.activeWorkout.routineName || 'Trwa trening';
      startGlobalWorkoutClock();
    }
  } catch (e) {
    console.warn('Błąd odzyskiwania:', e);
  }
}

// ============================================================================
// AUDIO I ALARM KOŃCA PRZERWY
// ============================================================================
function unlockIosAudioAndNotifications() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx && !state.sharedAudioCtx) state.sharedAudioCtx = new AudioCtx();
    if (state.sharedAudioCtx && state.sharedAudioCtx.state === 'suspended') state.sharedAudioCtx.resume();
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
  } catch (e) {}
}
window.addEventListener('touchstart', unlockIosAudioAndNotifications, { passive: true });
window.addEventListener('click', unlockIosAudioAndNotifications, { passive: true });

function triggerRestFinishedAlert() {
  const overlay = document.getElementById('rest-flash-overlay');
  const barInner = document.getElementById('active-workout-bar-inner');
  if (overlay) {
    overlay.classList.remove('hidden');
    overlay.classList.add('rest-flash-active');
    if (state.flashTimeout) clearTimeout(state.flashTimeout);
    state.flashTimeout = setTimeout(() => { dismissRestAlarm(); }, 5500);
  }
  if (barInner) {
    barInner.classList.add('ring-4', 'ring-striveOrange', 'bg-striveOrange/30');
    setTimeout(() => { barInner.classList.remove('ring-4', 'ring-striveOrange', 'bg-striveOrange/30'); }, 4000);
  }

  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!state.sharedAudioCtx && AudioCtx) state.sharedAudioCtx = new AudioCtx();
    const ctx = state.sharedAudioCtx;
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      [587.33, 783.99, 987.77, 1174.66].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'triangle';
        gain.gain.setValueAtTime(0.35, ctx.currentTime + idx * 0.16);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.16 + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + idx * 0.16);
        osc.stop(ctx.currentTime + idx * 0.16 + 0.15);
      });
    }
  } catch (e) {}

  try {
    if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 400]);
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('🔔 Koniec przerwy!', { body: 'Czas wracać pod sztangę!' });
    }
  } catch (e) {}
}

function dismissRestAlarm() {
  const overlay = document.getElementById('rest-flash-overlay');
  if (overlay) {
    overlay.classList.add('hidden');
    overlay.classList.remove('rest-flash-active');
  }
}

// ============================================================================
// LOGIKA TIMERA PRZERWY I ZEGAREK TRENINGU
// ============================================================================
function startRestTimer(seconds, label = 'Przerwa') {
  unlockIosAudioAndNotifications();
  dismissRestAlarm();
  state.restTimerTotal = seconds;
  state.restTimerEnd = Date.now() + seconds * 1000;
  state.restTimerLabel = label;
  persistActiveWorkoutState();
  updateRestTimerUI();
}

function cancelRestTimer() {
  state.restTimerEnd = null;
  state.restTimerTotal = null;
  persistActiveWorkoutState();
  updateRestTimerUI();
  dismissRestAlarm();
}

function adjustRestTimer(deltaSec) {
  if (!state.restTimerEnd) {
    const fallback = (state.activeWorkout && state.activeWorkout.workingRestSec) ? state.activeWorkout.workingRestSec : 90;
    startRestTimer(Math.max(15, fallback + deltaSec), 'Przerwa');
    return;
  }
  state.restTimerEnd += deltaSec * 1000;
  if (state.restTimerTotal) state.restTimerTotal += deltaSec;
  persistActiveWorkoutState();
  updateRestTimerUI();
}

function updateElapsedUI() {
  if (!state.activeWorkout) return;
  const elapsedSec = Math.floor((Date.now() - state.activeWorkout.startTime) / 1000);
  const mm = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
  const ss = String(elapsedSec % 60).padStart(2, '0');

  const barEl = document.getElementById('bar-elapsed-time');
  if (barEl) barEl.textContent = `${mm}:${ss}`;

  const modalEl = document.getElementById('modal-elapsed-time');
  if (modalEl) modalEl.textContent = `${mm}:${ss}`;
}

function startGlobalWorkoutClock() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    updateElapsedUI();
    updateRestTimerUI();
  }, 500);
}

function updateRestTimerUI() {
  const barBtn = document.getElementById('bar-timer-btn');
  const barStatus = document.getElementById('bar-timer-status');
  
  const modalBox = document.getElementById('modal-rest-timer-box');
  const modalVal = document.getElementById('modal-rest-timer-val');
  const modalLabel = document.getElementById('modal-rest-timer-label');
  const modalProgress = document.getElementById('modal-rest-timer-progress');

  if (!state.restTimerEnd) {
    if (modalBox) modalBox.classList.add('hidden');
    if (barBtn) barBtn.textContent = '⏱ 90s';
    if (barStatus && state.activeWorkout) {
      barStatus.textContent = 'Dotknij, by wrócić do serii';
    }
    return;
  }

  const rem = Math.ceil((state.restTimerEnd - Date.now()) / 1000);
  if (rem > 0) {
    const m = Math.floor(rem / 60);
    const s = String(rem % 60).padStart(2, '0');
    const timeFormatted = `${m}:${s}`;

    if (barBtn) barBtn.textContent = `⏱ ${timeFormatted}`;
    if (barStatus) barStatus.textContent = `${state.restTimerLabel}: pozostało ${rem} s`;

    if (modalBox) modalBox.classList.remove('hidden');
    if (modalVal) modalVal.textContent = timeFormatted;
    if (modalLabel) modalLabel.textContent = state.restTimerLabel;
    if (modalProgress && state.restTimerTotal) {
      const pct = Math.max(0, Math.min(100, (rem / state.restTimerTotal) * 100));
      modalProgress.style.width = `${pct}%`;
    }
  } else {
    state.restTimerEnd = null;
    state.restTimerTotal = null;
    persistActiveWorkoutState();

    if (barBtn) barBtn.textContent = `⏱ Gotowe!`;
    if (barStatus) barStatus.textContent = `🔔 KONIEC PRZERWY! Czas pod sztangę!`;

    if (modalBox) modalBox.classList.remove('hidden');
    if (modalVal) modalVal.textContent = `0:00`;
    if (modalLabel) modalLabel.textContent = `🔔 KONIEC PRZERWY!`;
    if (modalProgress) modalProgress.style.width = '0%';

    triggerRestFinishedAlert();
  }
}

// ============================================================================
// WBUDOWANA KLAWIATURA NUMERYCZNA
// ============================================================================
function kbdInputId(exIdx, sIdx, field) {
  return `kb-${exIdx}-${sIdx}-${field}`;
}

function highlightKbdInput() {
  document.querySelectorAll('.kbd-active').forEach(e => e.classList.remove('kbd-active'));
  const k = state.kbd;
  if (!k) return;
  const el = document.getElementById(kbdInputId(k.exIdx, k.sIdx, k.field));
  if (el) el.classList.add('kbd-active');
}

function ensureKbdInputVisible() {
  const k = state.kbd;
  if (!k) return;
  const el = document.getElementById(kbdInputId(k.exIdx, k.sIdx, k.field));
  const ov = document.getElementById('modal-overlay');
  const tb = document.getElementById('workout-topbar');
  const kp = document.getElementById('app-keypad');
  if (!el || !ov || !kp) return;
  const r = el.getBoundingClientRect();
  const topLimit = ((tb && !tb.classList.contains('hidden')) ? tb.getBoundingClientRect().bottom : 0) + 12;
  const bottomLimit = kp.getBoundingClientRect().top - 12;
  if (r.top < topLimit) ov.scrollTop -= (topLimit - r.top);
  else if (r.bottom > bottomLimit) ov.scrollTop += (r.bottom - bottomLimit);
}

function openKeypad(exIdx, sIdx, field) {
  if (!state.activeWorkout) return;
  const s = state.activeWorkout.exercises[exIdx].sets[sIdx];
  const cur = s[field];
  state.kbd = {
    exIdx, sIdx, field,
    buf: (cur === '' || cur === null || cur === undefined) ? '' : String(cur),
    fresh: true
  };
  const kp = document.getElementById('app-keypad');
  const ov = document.getElementById('modal-overlay');
  kp.classList.remove('hidden');
  if (ov) ov.style.paddingBottom = (kp.offsetHeight + 24) + 'px';
  highlightKbdInput();
  ensureKbdInputVisible();
}

function closeKeypad() {
  state.kbd = null;
  const kp = document.getElementById('app-keypad');
  if (kp) kp.classList.add('hidden');
  const ov = document.getElementById('modal-overlay');
  if (ov) ov.style.paddingBottom = '';
  document.querySelectorAll('.kbd-active').forEach(e => e.classList.remove('kbd-active'));
}

function applyKbdBuffer() {
  const k = state.kbd;
  if (!k || !state.activeWorkout) return;
  const s = state.activeWorkout.exercises[k.exIdx].sets[k.sIdx];
  s[k.field] = k.buf === '' ? '' : (parseFloat(k.buf) || 0);
  const el = document.getElementById(kbdInputId(k.exIdx, k.sIdx, k.field));
  if (el) el.value = k.buf;

  if (k.field === 'weight') {
    s.autoWeight = false; // ręcznie wpisany ciężar – nie jest już nadpisywany automatem
    propagateWeightFrom(k.exIdx, k.sIdx);
  }
  persistActiveWorkoutState();
}

function kbdKey(key) {
  const k = state.kbd;
  if (!k) return;

  if (key === 'back') {
    if (k.fresh) { k.buf = ''; k.fresh = false; }
    else k.buf = k.buf.slice(0, -1);
    applyKbdBuffer();
    return;
  }

  if (k.fresh) { k.buf = ''; k.fresh = false; }

  if (key === '.') {
    if (k.field === 'reps') return;
    if (k.buf.includes('.')) return;
    k.buf = k.buf === '' ? '0.' : k.buf + '.';
  } else {
    if (k.buf.length >= 6) return;
    if (k.buf === '0') k.buf = key; else k.buf += key;
  }
  applyKbdBuffer();
}

function kbdStep(dir) {
  const k = state.kbd;
  if (!k || !state.activeWorkout) return;
  const s = state.activeWorkout.exercises[k.exIdx].sets[k.sIdx];
  const delta = k.field === 'weight' ? 2.5 : 1;
  const cur = parseFloat(s[k.field]) || 0;
  const next = Math.max(0, Math.round((cur + dir * delta) * 100) / 100);
  k.buf = String(next);
  k.fresh = false;
  applyKbdBuffer();
}

function kbdNext() {
  const k = state.kbd;
  const w = state.activeWorkout;
  if (!k || !w) return;
  if (k.field === 'weight') {
    openKeypad(k.exIdx, k.sIdx, 'reps');
    return;
  }
  let nextS = k.sIdx + 1;
  let nextE = k.exIdx;
  if (nextS >= w.exercises[k.exIdx].sets.length) { nextE++; nextS = 0; }
  if (nextE >= w.exercises.length) { closeKeypad(); return; }
  openKeypad(nextE, nextS, 'weight');
}

// Automatyczne przepisywanie ciężaru: tylko w dół, tylko serie robocze (N), bez R i D
function propagateWeightFrom(exIdx, sIdx) {
  const w = state.activeWorkout;
  if (!w) return;
  const sets = w.exercises[exIdx].sets;
  const src = sets[sIdx];
  if ((src.type || 'N') !== 'N') return;

  const srcEmpty = src.weight === '' || src.weight === null || src.weight === undefined;

  for (let i = sIdx + 1; i < sets.length; i++) {
    const t = sets[i];
    if ((t.type || 'N') !== 'N') continue;
    if (t.done) continue;
    const tEmpty = t.weight === '' || t.weight === null || t.weight === undefined;

    if (srcEmpty) {
      // wyczyszczono źródło – czyścimy tylko to, co wypełnił automat
      if (t.autoWeight) { t.weight = ''; }
      else continue;
    } else if (tEmpty || t.autoWeight) {
      t.weight = src.weight;
      t.autoWeight = true;
    } else {
      continue; // ręcznie zmieniony ciężar – nie ruszamy
    }

    const el = document.getElementById(kbdInputId(exIdx, i, 'weight'));
    if (el) el.value = (t.weight === '' ? '' : String(t.weight));
  }
}

function mapPolishPartToSlugs(partName = '') {
  const p = String(partName).toLowerCase();
  if (p.includes('klatka')) return ['chest'];
  if (p.includes('skośne')) return ['obliques'];
  if (p.includes('brzuch') || p.includes('pas')) return ['abs', 'obliques'];
  if (p.includes('biceps') || p.includes('ramienny')) return ['biceps'];
  if (p.includes('triceps')) return ['triceps'];
  if (p.includes('przedram')) return ['forearm'];
  if (p.includes('barki') || p.includes('naramien')) return ['deltoids'];
  if (p.includes('czworoboczny') || p.includes('kaptur')) return ['trapezius'];
  if (p.includes('najszerszy') || p.includes('plecy (góra)') || p === 'plecy') return ['upper-back'];
  if (p.includes('prostownik') || p.includes('lędźw') || p.includes('dolny grzbiet')) return ['lower-back'];
  if (p.includes('pośladk')) return ['gluteal'];
  if (p.includes('odwodziciel')) return ['abductors'];
  if (p.includes('przywodziciel')) return ['adductors'];
  if (p.includes('czworogłow')) return ['quadriceps'];
  if (p.includes('dwugłow') || p.includes('kulszowo')) return ['hamstring'];
  if (p.includes('łydk') || p.includes('płaszczkowat')) return ['calves'];
  if (p.includes('piszczel')) return ['tibialis'];
  if (p.includes('kark') || p.includes('szyja')) return ['neck'];
  return ['chest'];
}

function renderExactRnBodySvg(bodyToRender, borderPaths, getSlugStyle, side = 'front') {
  const defaultFill = '#3f3f3f';
  const viewBox = side === 'back' ? '724 0 724 1448' : '0 0 724 1448';

  const borderOutlines = (borderPaths || []).map(d =>
    `<path d="${d}" fill="#dfdfdf" opacity="0.85" />`
  ).join('');

  const partsMarkup = bodyToRender.map(bodyPart => {
    const slug = bodyPart.slug;
    const isNonMuscle = slug === 'head' || slug === 'hair' || slug === 'hands' || slug === 'feet' || slug === 'ankles' || slug === 'knees';
    const st = isNonMuscle
      ? { fill: (slug === 'hair' ? '#1f2430' : '#2d323e'), cls: '' }
      : getSlugStyle(slug);

    const fillColor = st.fill || defaultFill;
    const clsName = st.cls || '';

    const allD = [
      ...(bodyPart.path?.common || []),
      ...(bodyPart.path?.left || []),
      ...(bodyPart.path?.right || [])
    ];

    return allD.map(d =>
      `<path id="${slug}" d="${d}" fill="${fillColor}" class="${clsName}" stroke="#12161f" stroke-width="1.2" />`
    ).join('');
  }).join('');

  return `
    <svg viewBox="${viewBox}" class="w-36 h-64 mx-auto block">
      ${borderOutlines}
      ${partsMarkup}
    </svg>
  `;
}

// Renderowanie mapy mięśni (Bez rozgrzewek 'R' + Progi tygodniowe: Min 2-3, Śr. 4-7, Max 8-12+)

  const partSets = {};

function translateEquipmentToPolish(equipment = '') {
  const eq = String(equipment).toLowerCase().trim();
  const map = {
    'body weight': 'Masa ciała', 'barbell': 'Sztanga', 'dumbbell': 'Hantle',
    'cable': 'Wyciąg', 'kettlebell': 'Kettlebell', 'band': 'Taśma oporowa',
    'weighted': 'Obciążenie', 'stability ball': 'Piłka gimnastyczna',
    'ez barbell': 'Sztanga łamana EZ', 'leverage machine': 'Maszyna',
    'smith machine': 'Suwnica Smitha', 'assisted': 'Maszyna wspomagana'
  };
  if (map[eq]) return map[eq];
  if (eq.includes('machine') || eq.includes('leverage')) return 'Maszyna';
  if (eq.includes('cable')) return 'Wyciąg';
  if (eq.includes('dumbbell')) return 'Hantle';
  if (eq.includes('barbell')) return 'Sztanga';
  return equipment ? (equipment.charAt(0).toUpperCase() + equipment.slice(1)) : 'Inne';
}

async function initCatalogOnly(forceReload = false) {
  const exCount = await db.exercises.count();
  if (exCount >= 1000 && !forceReload) return;

  const banner = document.getElementById('sync-banner');
  const bannerTxt = document.getElementById('sync-banner-text');
  if (banner) banner.classList.remove('hidden');

  try {
    let response = await fetch('data/exercises.json').catch(() => null);
    if (!response || !response.ok) {
      response = await fetch(`${REPO_RAW}/data/exercises.json`);
    }
    if (!response || !response.ok) throw new Error('Błąd pobierania');

    const exercisesData = await response.json();
    const existingList = await db.exercises.toArray();
    const existingMetaMap = {};
    existingList.forEach(old => {
      if (old.slug) existingMetaMap[old.slug] = { sessions: old.sessions || 0, nextTargetWeight: old.nextTargetWeight || null };
    });

    const catalog = exercisesData.map(ex => {
      const category = translateEquipmentToPolish(ex.equipment || '');
      const bodyPart = translateTargetToPolish(ex.target || '', ex.category || ex.body_part || '');
      const name = formatExerciseTitle(ex.name || 'Ćwiczenie');

      let tip = 'Kontroluj fazę opuszczania i pilnuj zakresu ruchu.';
      if (ex.instructions) {
        if (typeof ex.instructions.pl === 'string' && ex.instructions.pl.trim() !== '') {
          tip = ex.instructions.pl.trim();
        } else if (typeof ex.instructions.en === 'string' && ex.instructions.en.trim() !== '') {
          tip = ex.instructions.en.trim();
        }
      }

      const rawSec = [
        ...(Array.isArray(ex.secondary_muscles) ? ex.secondary_muscles : []),
        ...(ex.muscle_group ? [ex.muscle_group] : [])
      ];
      const secondaryMuscles = [...new Set(rawSec.map(m => translateTargetToPolish(m, '')).filter(m => m && m !== bodyPart && m !== 'Inne'))];

      const slug = String(ex.id || ex.slug || name.toLowerCase().replace(/[^a-z0-9]+/g, '_'));
      const cleanGifRel = (ex.gif_url || '').replace(/^\.?\//, '');
      const cleanImgRel = (ex.image || '').replace(/^\.?\//, '');

      const rawGifUrl = cleanGifRel ? `${REPO_RAW}/${cleanGifRel}` : '';
      const imageUrl = cleanImgRel ? `${REPO_RAW}/${cleanImgRel}` : '';
      const prevMeta = existingMetaMap[slug] || {};

      return {
        slug,
        name,
        category,
        bodyPart,
        secondaryMuscles,
        sessions: prevMeta.sessions || 0,
        nextTargetWeight: prevMeta.nextTargetWeight || null,
        tip,
        customGifUrl: rawGifUrl,
        imageUrl
      };
    });

    await db.exercises.clear();
    await db.exercises.bulkAdd(catalog);

    if (bannerTxt) bannerTxt.textContent = `✓ Załadowano ${catalog.length} ćwiczeń oraz mięśnie poboczne!`;
    setTimeout(() => { if (banner) banner.classList.add('hidden'); }, 1800);
    renderCurrentView();
  } catch (error) {
    console.error('Błąd:', error);
    if (banner) banner.classList.add('hidden');
  }
}

function checkIosStandaloneMode() {
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const dismissed = localStorage.getItem('gymWK_hide_pwa_hint') === '1';
  const hintEl = document.getElementById('ios-pwa-hint');
  if (!isStandalone && !dismissed && hintEl) hintEl.classList.remove('hidden');
}

function dismissPwaHint() {
  localStorage.setItem('gymWK_hide_pwa_hint', '1');
  const hintEl = document.getElementById('ios-pwa-hint');
  if (hintEl) hintEl.classList.add('hidden');
}

function toLocalIso(dateObj = new Date()) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  const d = String(dateObj.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function formatDayMonth(dateObj) {
  const d = String(dateObj.getDate()).padStart(2, '0');
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  return `${d}.${m}`;
}

function parseRepRange(rangeStr) {
  const clean = String(rangeStr || '8-10').trim();
  const match = clean.match(/(\d+)\s*[-–/]\s*(\d+)/);
  if (match) {
    const min = parseInt(match[1], 10);
    const max = parseInt(match[2], 10);
    return { min: Math.min(min, max), max: Math.max(min, max), text: `${min}-${max}` };
  }
  const single = parseInt(clean, 10) || 10;
  return { min: single, max: single, text: `${single}` };
}

function getSetBadgeInfo(setsArray, currentIndex) {
  const current = setsArray[currentIndex];
  const type = current.type || 'N';
  if (type === 'R') return { label: 'R', isWorking: false, classes: 'bg-striveOrange/20 text-striveOrange border border-striveOrange/60' };
  if (type === 'D') return { label: 'D', isWorking: false, classes: 'bg-purple-500/20 text-purple-300 border border-purple-400/50' };
  let workingNumber = 0;
  for (let i = 0; i <= currentIndex; i++) {
    if ((setsArray[i].type || 'N') === 'N') workingNumber++;
  }
  return { label: String(workingNumber), isWorking: true, workIdx: workingNumber - 1, classes: 'bg-striveTeal/25 text-white border border-striveTeal/60' };
}

function nextSetType(currentType) {
  if (!currentType || currentType === 'N') return 'R';
  if (currentType === 'R') return 'D';
  return 'N';
}

function renderAnimatedExerciseThumb(ex, sizeClass = 'w-14 h-14') {
  if (!ex || ex.isPlaceholder) {
    return `<div class="${sizeClass} rounded-2xl bg-striveTealDark/60 border border-striveTeal/50 flex items-center justify-center shrink-0 text-xs font-bold text-striveTeal">?</div>`;
  }
  const primarySrc = ex.customGifUrl || ex.imageUrl || '';
  const fallbackSrc = ex.imageUrl || primarySrc;

  if (primarySrc) {
    return `
      <div class="${sizeClass} rounded-2xl bg-white flex items-center justify-center shrink-0 overflow-hidden border border-white/25 shadow-inner relative">
        <img src="${primarySrc}" alt="${ex.name || 'Ćwiczenie'}" loading="lazy"
          onerror="if(this.src !== '${fallbackSrc}'){this.src='${fallbackSrc}';}else{this.style.opacity='0.25';}"
          class="w-full h-full object-contain bg-white" />
      </div>`;
  }
  return `<div class="${sizeClass} rounded-2xl bg-striveTealDark/60 border border-striveTeal/50 flex items-center justify-center shrink-0 text-xs font-bold text-striveTeal">🏋️</div>`;
}

function compressImageFileToDataUrl(file) {

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxW = 800;
        const scale = Math.min(1, maxW / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// NAWIGACJA
// ============================================================================
function navigate(tabName) {
  state.tab = tabName;
  document.querySelectorAll('nav button').forEach(btn => {
    btn.classList.remove('text-striveOrange');
    btn.classList.add('text-gray-300');
    const dot = btn.querySelector('.nav-dot');
    if (dot) dot.classList.add('hidden');
  });
  const activeBtn = document.getElementById('nav-' + tabName);
  if (activeBtn) {
    activeBtn.classList.remove('text-gray-300');
    activeBtn.classList.add('text-striveOrange');
    const dot = activeBtn.querySelector('.nav-dot');
    if (dot) dot.classList.remove('hidden');
  }

  const subnav = document.getElementById('workout-subnav');
  if (tabName === 'hub') {
    subnav.classList.remove('hidden');
    updateSubNavHighlight();
  } else {
    subnav.classList.add('hidden');
  }

  renderCurrentView();
}

function switchWorkoutSubTab(sub) {
  state.hubSubTab = sub;
  updateSubNavHighlight();
  renderCurrentView();
}

function updateSubNavHighlight() {
  ['plans', 'routines', 'exercises'].forEach(s => {
    const el = document.getElementById('subtab-' + s);
    if (state.hubSubTab === s) {
      el.className = 'py-2 rounded-xl liquid-pill text-white font-bold shadow transition';
    } else {
      el.className = 'py-2 rounded-xl text-gray-300 transition';
    }
  });
}

async function renderCurrentView() {
  const container = document.getElementById('app-content');
  if (state.tab === 'home') container.innerHTML = await renderHomeView();
  else if (state.tab === 'hub') {
    if (state.hubSubTab === 'plans') container.innerHTML = await renderPlansView();
    else if (state.hubSubTab === 'routines') container.innerHTML = await renderRoutinesView();
    else if (state.hubSubTab === 'exercises') container.innerHTML = await renderExercisesView();
  }
  else if (state.tab === 'profile') container.innerHTML = await renderProfileView();
  else if (state.tab === 'calendar') container.innerHTML = await renderCalendarView();
}

async function renderHomeView() {
  const workouts = await db.workouts.toArray();
  workouts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  const measurements = await db.measurements.orderBy('date').toArray();
  const routines = await db.routines.toArray();
  const allEx = await db.exercises.toArray();
  const exMap = Object.fromEntries(allEx.map(e => [e.id, e]));
  const activePlan = await db.plans.where('active').equals(1).first();
  const noteObj = await db.settings.get('stickyNote');
  const stickyText = noteObj ? noteObj.value : 'Naciśnij aby edytować tekst';

  const latestWeight = measurements.length ? `${measurements[measurements.length - 1].weight} kg` : 'Brak wpisu';
  let weightDiffHtml = 'Dodaj pierwszy pomiar';
  if (measurements.length >= 2) {
    const firstW = measurements[0].weight;
    const lastW = measurements[measurements.length - 1].weight;
    const pct = (((lastW - firstW) / firstW) * 100).toFixed(1);
    weightDiffHtml = `${pct >= 0 ? '+' : ''}${pct} %`;
  }

  const workoutDates = new Set(workouts.map(w => w.date));
  let heatmapCells = '';
  const today = new Date();
  for (let i = 111; i >= 0; i--) {
    const d = new Date(today.getTime() - i * 86400000);
    const iso = toLocalIso(d);
    const hasW = workoutDates.has(iso);
    const isToday = i === 0;
    heatmapCells += `<div class="w-2.5 h-2.5 rounded-[3px] ${hasW ? 'bg-striveTeal shadow-[0_0_6px_rgba(92,200,230,0.6)]' : 'bg-white/10'} ${isToday ? 'ring-1 ring-striveOrange' : ''}"></div>`;
  }

  const currDayIdx = (today.getDay() + 6) % 7;
  const plannedDaysSet = new Set(activePlan && activePlan.days ? activePlan.days : routines.map(r => r.assignedDay).filter(Boolean));

  let weekRowHtml = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(today.getTime() - (currDayIdx - i) * 86400000);
    const iso = toLocalIso(d);
    const dayLabel = DAYS_SHORT[i];
    const dateNum = formatDayMonth(d);
    const done = workoutDates.has(iso);
    const isToday = i === currDayIdx;
    const isPlanned = plannedDaysSet.has(dayLabel);

    weekRowHtml += `
      <div onclick="openQuickStartModal()" class="flex flex-col items-center gap-1 cursor-pointer active:scale-95 transition">
        <span class="text-xs ${isToday ? 'text-striveOrange font-bold' : 'text-gray-300'}">${dayLabel}</span>
        <span class="text-[10px] ${isToday ? 'text-striveOrange font-semibold' : 'text-gray-500'}">${dateNum}</span>
        <div class="w-7 h-7 rounded-full flex items-center justify-center border text-xs font-bold transition
          ${done ? 'border-striveGreen text-striveGreen bg-striveGreen/15 shadow-[0_0_10px_rgba(50,215,75,0.3)]' : (isPlanned ? 'border-striveTeal text-striveTeal bg-striveTeal/15' : 'border-white/15 text-white/25')}">
          ${done ? '✓' : (isPlanned ? '•' : '–')}
        </div>
      </div>`;
  }

  const startOfWeek = new Date(today.getTime() - currDayIdx * 86400000);
  startOfWeek.setHours(0,0,0,0);
  const startOfWeekIso = toLocalIso(startOfWeek);

  const thisWeekWorkouts = workouts.filter(w => w.date >= startOfWeekIso);
  const thisWeekCount = thisWeekWorkouts.length;
  const currentMonthPrefix = toLocalIso(today).slice(0, 7);
  const thisMonthCount = workouts.filter(w => w.date.startsWith(currentMonthPrefix)).length;

  const weeklyExercisesAggregated = [];
  thisWeekWorkouts.forEach(w => {
    (w.exercises || []).forEach(ex => {
      const dbEx = exMap[ex.exId];
      weeklyExercisesAggregated.push({
        ...ex,
        bodyPart: ex.bodyPart || (dbEx ? dbEx.bodyPart : 'Klatka'),
        secondaryMuscles: (ex.secondaryMuscles && ex.secondaryMuscles.length) ? ex.secondaryMuscles : (dbEx ? dbEx.secondaryMuscles : [])
      });
    });
  });

  // Tygodniowa Mapa Mięśni z progami: Min 2-3, Średnio 4-7, Max 8-12+ (isWeekly = true)
  const weeklyMuscleHeatmapHtml = renderAnatomicalMuscleMap(
    weeklyExercisesAggregated,
    `🔥 Tygodniowa Mapa Mięśni (${formatDayMonth(startOfWeek)} – ${formatDayMonth(today)})`,
    true
  );

  const lastWorkout = workouts[0];
  const lastWorkoutHtml = lastWorkout ? `
    <div onclick="navigate('calendar')" class="liquid-pill rounded-3xl p-4 cursor-pointer active:scale-[0.99] transition">
      <div class="flex justify-between items-center mb-1.5">
        <h3 class="text-base font-bold text-white">${lastWorkout.routineName}</h3>
        <span class="text-[11px] text-gray-200">${lastWorkout.date} →</span>
      </div>
      <div class="flex items-center gap-4 text-xs text-gray-100">
        <span>🕒 ${Math.floor(lastWorkout.durationMin / 60)}h, ${lastWorkout.durationMin % 60}min</span>
        <span>📊 Serie: ${lastWorkout.totalSets}</span>
        <span>∑ Objętość: ${lastWorkout.totalVolume} kg</span>
      </div>
    </div>
  ` : `
    <div onclick="openQuickStartModal()" class="liquid-pill rounded-3xl p-4 text-center cursor-pointer active:scale-[0.99] transition">
      <div class="text-sm font-bold text-white mb-0.5">Brak wykonanych treningów</div>
      <div class="text-xs text-gray-200">Dotknij tutaj lub kliknij „+” w szklanym docku na dole, aby rozpocząć trening</div>
    </div>
  `;

  return `
    <div class="flex justify-between items-center mb-3.5 pt-1">
      <span class="text-xs text-gray-400 font-mono bg-white/5 px-2.5 py-1 rounded-full border border-white/10">${toLocalIso(today)}</span>
      <h1 class="text-xl font-extrabold tracking-tight">gym<span class="text-striveOrange">WK</span></h1>
      <button onclick="openQuickStartModal()" class="liquid-pill text-white text-xs font-bold px-3.5 py-1.5 rounded-full active:scale-95 transition">Trenuj</button>
    </div>

    <div class="bg-bgCard rounded-3xl p-3.5 mb-1.5">
      <div class="heatmap-grid justify-center overflow-hidden py-1">${heatmapCells}</div>
    </div>
    <p class="text-center text-[11px] text-gray-400 mb-3">Regularność w ostatnich tygodniach</p>

    <!-- Tygodniowy zestaw dni -->
    <div class="bg-bgCard rounded-3xl p-3.5 mb-1">
      <div class="flex justify-between items-center px-0.5">${weekRowHtml}</div>
    </div>
    <p class="text-center text-[11px] text-gray-400 mb-3">
      <span class="text-striveGreen font-bold">✓</span> zrobiony · <span class="text-striveTeal font-bold">•</span> dzień treningowy · <span class="text-gray-500">–</span> wolne
    </p>

    ${weeklyMuscleHeatmapHtml}

    <div onclick="navigate('profile'); setTimeout(()=>openMeasurementsModal(),100)" class="bg-bgCard rounded-3xl p-4 mb-1 relative overflow-hidden cursor-pointer min-h-[104px] flex flex-col justify-between active:scale-[0.99] transition">
      <div><span class="liquid-orange-btn text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full">Waga i Sylwetka</span></div>
      <div class="text-right mt-3">
        <div class="text-2xl font-extrabold text-white tracking-tight">${latestWeight}</div>
        <div class="text-xs text-striveTeal font-semibold">${weightDiffHtml}</div>
      </div>
    </div>
    <p class="text-center text-[11px] text-gray-400 mb-3">Dotknij, aby wpisać pomiar lub dodać zdjęcia z galerii</p>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div onclick="editStickyNote()" class="liquid-pill rounded-3xl p-3.5 flex flex-col justify-between min-h-[148px] cursor-pointer active:scale-[0.98] transition">
        <p class="text-sm text-white/95 font-medium leading-snug break-words">${stickyText}</p>
        <span class="text-[10px] text-white/70 text-right mt-2">✎ Karteczka</span>
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        <div class="bg-bgCard rounded-3xl p-2 flex flex-col items-center justify-center">
          <span class="text-lg">🔥</span>
          <span class="text-xl font-extrabold mt-0.5">${workouts.length}</span>
          <span class="text-[10px] text-gray-400 text-center">Łącznie</span>
        </div>
        <div class="bg-bgCard rounded-3xl p-2 flex flex-col items-center justify-center">
          <span class="text-xl font-extrabold text-striveTeal">${thisWeekCount}</span>
          <span class="text-[10px] text-gray-400 text-center mt-1">🏋️ tego tyg.</span>
        </div>
        <div class="bg-bgCard rounded-3xl p-2 flex flex-col items-center justify-center">
          <span class="text-xl font-extrabold">${thisMonthCount}</span>
          <span class="text-[10px] text-gray-400 text-center mt-1">📅 tego mies.</span>
        </div>
        <div class="bg-bgCard rounded-3xl p-2 flex flex-col items-center justify-center">
          <span class="text-lg">📌</span>
          <span class="text-xl font-extrabold mt-0.5">${routines.length}</span>
          <span class="text-[10px] text-gray-400 text-center">Rutyn</span>
        </div>
      </div>
    </div>

    ${lastWorkoutHtml}
  `;
}

async function editStickyNote() {
  const noteObj = await db.settings.get('stickyNote');
  const nextVal = prompt('Wpisz tekst na karteczkę:', noteObj ? noteObj.value : '');
  if (nextVal !== null) {
    await db.settings.put({ key: 'stickyNote', value: nextVal || 'Naciśnij aby edytować tekst' });
    renderCurrentView();
  }
}

async function renderPlansView() {
  const plans = await db.plans.toArray();
  const activePlan = plans.find(p => p.active === 1) || plans[0];
  const routines = await db.routines.toArray();

  if (!activePlan) {
    return `
      <div class="text-center py-14 px-4 bg-bgCard rounded-3xl mt-2">
        <h2 class="text-xl font-bold mb-2">Brak aktywnego planu</h2>
        <p class="text-xs text-gray-300 mb-6 leading-relaxed">Utwórz swoje rutyny w zakładce „Rutyny”, a następnie połącz je w Plan.</p>
        <div class="flex justify-center gap-3">
          <button onclick="switchWorkoutSubTab('routines')" class="liquid-pill text-white font-bold text-xs px-4 py-3 rounded-2xl">Przejdź do Rutyn</button>
          <button onclick="openPlanWizard()" class="liquid-orange-btn text-white font-bold text-xs px-5 py-3 rounded-2xl">+ Utwórz Plan</button>
        </div>
      </div>`;
  }

  const today = new Date();
  const todayShort = DAYS_SHORT[(today.getDay() + 6) % 7];
  const planRoutines = (activePlan.routineIds || []).map(id => routines.find(r => r.id === id)).filter(Boolean);

  let defaultRoutine = planRoutines.find(r => r.assignedDay === todayShort)
    || planRoutines[(activePlan.nextIndex || 0) % Math.max(1, planRoutines.length)]
    || routines[0];

  const selectedRoutine = routines.find(r => r.id === Number(state.selectedTodayRoutineId)) || defaultRoutine;

  const scheduleRow = DAYS_SHORT.map(d => {
    const isToday = d === todayShort;
    const assignedR = planRoutines.find(r => r.assignedDay === d);
    const isPlanDay = (activePlan.days || []).includes(d) || Boolean(assignedR);
    return `
      <div class="bg-bgCard border ${isToday ? 'border-striveOrange' : 'border-white/10'} rounded-2xl p-1.5 text-center">
        <div class="text-[10px] font-bold ${isToday ? 'text-striveOrange' : 'text-gray-400'}">${d}</div>
        <div class="text-[9px] mt-1 truncate ${isPlanDay ? 'text-striveTeal font-semibold' : 'text-gray-500'}">
          ${assignedR ? assignedR.name : (isPlanDay ? 'Trening' : 'Wolne')}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="flex justify-between items-center mb-4 pt-1">
      <button onclick="deletePlan(${activePlan.id})" class="text-xs text-gray-400">Usuń</button>
      <h1 class="text-lg font-bold">Aktywny Plan</h1>
      <button onclick="openPlanWizard()" class="liquid-pill text-white font-bold text-xs px-3.5 py-1.5 rounded-full">+ Nowy</button>
    </div>

    <div class="flex justify-between items-center mb-3">
      <div>
        <h2 class="text-2xl font-extrabold">${activePlan.name}</h2>
        <span class="text-xs text-gray-400">${activePlan.goal} · Globalna pamięć ciężarów</span>
      </div>
      <span class="liquid-pill text-xs px-3 py-1 rounded-full font-semibold">${activePlan.progressionRule || 'Podwójna progresja'}</span>
    </div>

    <p class="text-xs font-semibold text-gray-300 mb-1.5">Rozkład dni (Dziś: <span class="text-striveOrange">${todayShort} ${formatDayMonth(today)}</span>)</p>
    <div class="grid grid-cols-7 gap-1 mb-5">${scheduleRow}</div>

    <div class="bg-bgCard rounded-3xl p-4 mb-4">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold uppercase text-striveOrange">Wybierz trening na dziś:</span>
        <span class="text-[11px] text-gray-300">${selectedRoutine && selectedRoutine.assignedDay ? `Dzień: ${selectedRoutine.assignedDay}` : 'Elastyczny'}</span>
      </div>

      ${routines.length ? `
        <div class="flex flex-col gap-2.5">
          <select onchange="state.selectedTodayRoutineId = this.value; renderCurrentView()"
            class="w-full bg-bgInput rounded-2xl px-3.5 py-3 text-sm font-bold text-white focus:outline-none">
            ${routines.map(r => `
              <option value="${r.id}" ${selectedRoutine && selectedRoutine.id === r.id ? 'selected' : ''}>
                ${r.name} ${r.assignedDay ? `[Przypisany: ${r.assignedDay}]` : ''} (${(r.exercises || []).length} ćw.)
              </option>
            `).join('')}
          </select>

          <div class="flex gap-2">
            <button onclick="skipTodayRoutine(${activePlan.id})" class="flex-1 bg-white/10 text-white text-xs font-bold py-3 rounded-2xl active:scale-95 transition">Pomiń</button>
            <button onclick="startWorkout(${selectedRoutine.id})" class="flex-[2] liquid-orange-btn text-white text-sm font-bold py-3 rounded-2xl active:scale-95 transition">
              🏋️ Trenuj: ${selectedRoutine.name}
            </button>
          </div>
        </div>
      ` : `<p class="text-xs text-gray-400">Brak rutyn. Dodaj pierwszą rutynę w zakładce „Rutyny”.</p>`}
    </div>
  `;
}

async function skipTodayRoutine(planId) {
  const plan = await db.plans.get(planId);
  if (!plan) return;
  state.selectedTodayRoutineId = null;
  await db.plans.update(planId, { nextIndex: (plan.nextIndex || 0) + 1 });
  renderCurrentView();
}

async function deletePlan(planId) {
  if (confirm('Usunąć ten plan?')) {
    await db.plans.delete(planId);
    renderCurrentView();
  }
}

async function renderRoutinesView() {
  const routines = await db.routines.toArray();
  const exercises = await db.exercises.toArray();
  const exMap = Object.fromEntries(exercises.map(e => [e.id, e]));

  const emptyHtml = `
    <div class="text-center py-14 px-4 bg-bgCard rounded-3xl">
      <h3 class="text-base font-bold mb-1">Nie masz jeszcze żadnej rutyny</h3>
      <p class="text-xs text-gray-300 mb-4">Stwórz rutynę i dobierz ćwiczenia z bazy GIF-ów.</p>
      <button onclick="openRoutineCreatorModal()" class="liquid-orange-btn text-white text-xs font-bold px-5 py-3 rounded-2xl">+ Stwórz pierwszą rutynę</button>
    </div>`;

  let cardsHtml = routines.map(r => {
    const exListHtml = (r.exercises || []).map(item => {
      const ex = item.isPlaceholder ? { name: item.placeholderName } : exMap[item.exId];
      const setsArr = item.setsList || Array.from({ length: item.sets || 3 }, () => ({ type: 'N', reps: '8-10' }));
      const workingSets = setsArr.filter(s => (s.type || 'N') === 'N');
      const warmupCount = setsArr.filter(s => s.type === 'R').length;
      const dropCount = setsArr.filter(s => s.type === 'D').length;
      const repSample = workingSets[0] ? workingSets[0].reps : '8-10';
      const badgeSummary = `${warmupCount ? `${warmupCount}R+` : ''}${workingSets.length}x (${repSample})${dropCount ? `+${dropCount}D` : ''}`;

      return `
        <div class="flex justify-between items-start text-xs py-0.5 text-gray-200 gap-1">
          <span class="leading-tight">${item.superset ? '🔗 ' : ''}${ex ? ex.name : 'Ćwiczenie'}</span>
          <span class="text-striveTeal font-semibold shrink-0 text-[11px]">${badgeSummary}</span>
        </div>`;
    }).join('');

    return `
      <div class="bg-bgCard rounded-3xl p-3.5 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-start gap-1 mb-1">
            <div>
              <h3 class="font-bold text-sm leading-tight">${r.name}</h3>
              <span class="text-[10px] text-striveOrange font-semibold block">${r.assignedDay ? `📅 Dzień: ${r.assignedDay}` : '📅 Dowolny dzień'}</span>
              <span class="text-[10px] text-gray-400">⏱ R: ${r.warmupRestSec || 60}s · Robocza: ${r.workingRestSec || 120}s</span>
            </div>
            <button onclick="openRoutineActionsModal(${r.id})" class="bg-white/10 text-white px-2 py-0.5 rounded-xl text-xs font-bold">•••</button>
          </div>
          <div class="space-y-1 my-2 border-t border-white/10 pt-2">${exListHtml}</div>
        </div>
        <button onclick="startWorkout(${r.id})" class="w-full liquid-orange-btn text-white text-xs font-bold py-2.5 rounded-2xl mt-2 active:scale-95 transition">Trenuj</button>
      </div>`;
  }).join('');

  return `
    <div class="flex justify-between items-center mb-4 pt-1">
      <span class="text-striveTeal text-xs font-bold uppercase">Twoje zestawy</span>
      <h1 class="text-lg font-bold">Rutyny</h1>
      <button onclick="openRoutineCreatorModal()" class="liquid-orange-btn text-white text-xs font-bold px-3.5 py-1.5 rounded-full">Dodaj +</button>
    </div>
    ${routines.length ? `<div class="grid grid-cols-2 gap-2.5">${cardsHtml}</div>` : emptyHtml}
  `;
}

async function openRoutineActionsModal(routineId) {
  const r = await db.routines.get(routineId);
  if (!r) return;
  openModal(`
    <div class="flex justify-between items-center mb-5">
      <button onclick="closeModal()" class="text-2xl">✕</button>
      <h2 class="text-lg font-bold">${r.name}</h2>
      <div class="w-6"></div>
    </div>
    <div class="space-y-2.5">
      <button onclick="startWorkout(${r.id})" class="w-full liquid-orange-btn text-white font-bold py-3.5 rounded-2xl text-sm">🏋️ Rozpocznij ten trening teraz</button>
      <button onclick="openRoutineCreatorModal(${r.id})" class="w-full liquid-pill text-white font-bold py-3.5 rounded-2xl text-sm">✎ Edytuj rutynę, przerwy i serie</button>
      <button onclick="duplicateRoutine(${r.id})" class="w-full bg-bgCard text-white font-bold py-3.5 rounded-2xl text-sm">📋 Duplikuj rutynę</button>
      <button onclick="deleteRoutine(${r.id})" class="w-full bg-red-950/60 border border-red-500/40 text-red-300 font-bold py-3.5 rounded-2xl text-sm">🗑 Usuń rutynę</button>
    </div>
  `);
}

async function duplicateRoutine(routineId) {
  const r = await db.routines.get(routineId);
  if (!r) return;
  const copy = { ...r, name: `${r.name} (Kopia)` };
  delete copy.id;
  await db.routines.add(copy);
  closeModal();
  renderCurrentView();
}

async function deleteRoutine(id) {
  if (confirm('Na pewno usunąć tę rutynę?')) {
    await db.routines.delete(id);
    closeModal();
    renderCurrentView();
  }
}

async function openRoutineCreatorModal(editRoutineId = null) {
  if (editRoutineId) {
    const existing = await db.routines.get(editRoutineId);
    const cloned = JSON.parse(JSON.stringify(existing));
    if (!cloned.warmupRestSec) cloned.warmupRestSec = 60;
    if (!cloned.workingRestSec) cloned.workingRestSec = 120;
    cloned.exercises = (cloned.exercises || []).map(item => {
      if (!item.setsList || !item.setsList.length) {
        item.setsList = Array.from({ length: item.sets || 3 }, () => ({
          type: 'N',
          reps: item.repsRange || '8-10',
          weight: ''
        }));
      }
      return item;
    });
    state.routineDraft = cloned;
  } else if (!state.routineDraft) {
    state.routineDraft = {
      id: null,
      name: '',

      workingRestSec: 120,
      desc: '',

      exercises: []
    };
  }
  await renderRoutineDraftModal();
}

    </button>

function applyRangeToAllWorkingSets(exIdx, newRange) {
  const list = state.routineDraft.exercises[exIdx].setsList || [];
  list.forEach(s => {
    if ((s.type || 'N') === 'N') s.reps = newRange;
  });
  renderRoutineDraftModal(true);
}

function cycleDraftSetType(exIdx, sIdx) {
  const s = state.routineDraft.exercises[exIdx].setsList[sIdx];
  s.type = nextSetType(s.type);
  renderRoutineDraftModal(true);
}

function addDraftSet(exIdx, setType = 'N') {
  const list = state.routineDraft.exercises[exIdx].setsList;
  const lastWorking = [...list].reverse().find(s => (s.type || 'N') === 'N') || list[list.length - 1] || { reps: '8-10' };
  list.push({
    type: setType,
    reps: lastWorking.reps || '8-10',
    weight: ''
  });
  renderRoutineDraftModal(true);
}

function removeDraftSet(exIdx, sIdx) {
  const list = state.routineDraft.exercises[exIdx].setsList;
  if (list.length <= 1) return;
  list.splice(sIdx, 1);
  renderRoutineDraftModal(true);
}

function moveDraftExercise(idx, dir) {
  const arr = state.routineDraft.exercises;
  const target = idx + dir;
  if (target < 0 || target >= arr.length) return;
  const temp = arr[idx];
  arr[idx] = arr[target];
  arr[target] = temp;
  renderRoutineDraftModal(true);
}

function removeDraftExercise(idx) {
  state.routineDraft.exercises.splice(idx, 1);
  renderRoutineDraftModal(true);
}

function addPlaceholderToDraft() {
  const name = prompt('Nazwa placeholdera:', 'Dowolne ćwiczenie');
  if (!name) return;
  state.routineDraft.exercises.push({
    isPlaceholder: true,
    placeholderName: name,
    setsList: [
      { type: 'N', reps: '8-10', weight: '' },
      { type: 'N', reps: '8-10', weight: '' },
      { type: 'N', reps: '8-10', weight: '' }
    ]
  });
  renderRoutineDraftModal(true);
}

async function openExercisePickerForDraft() {
  state.pickerSelectedIds = [];
  state.pickerSupersetMode = false;
  state.pickerScrollTop = 0;
  state.exerciseDisplayLimit = 80;
  await renderExercisePickerModal(false);
}

async function renderExercisePickerModal(preserveScroll = true) {
  const existingScrollEl = document.getElementById('picker-exercises-scroll');
  if (preserveScroll && existingScrollEl) {
    state.pickerScrollTop = existingScrollEl.scrollTop;
  } else if (!preserveScroll) {
    state.pickerScrollTop = 0;
  }

  const allEx = await db.exercises.toArray();
  const categories = ['ALL', ...new Set(allEx.map(e => e.category))];
  const parts = ['ALL', ...new Set(allEx.map(e => e.bodyPart))];
  const q = state.exerciseSearch.toLowerCase();

  const filtered = allEx.filter(e => {
    const matchCat = state.exerciseFilterCat === 'ALL' || e.category === state.exerciseFilterCat;
    const matchPart = state.exerciseFilterPart === 'ALL' || e.bodyPart === state.exerciseFilterPart || (Array.isArray(e.secondaryMuscles) && e.secondaryMuscles.includes(state.exerciseFilterPart));
    const matchSearch = !q || e.name.toLowerCase().includes(q) || (e.bodyPart && e.bodyPart.toLowerCase().includes(q));
    return matchCat && matchPart && matchSearch;
  });

  const visible = filtered.slice(0, state.exerciseDisplayLimit);

  const rowsHtml = visible.map(ex => {
    const picked = state.pickerSelectedIds.includes(ex.id);
    const secInfo = (ex.secondaryMuscles && ex.secondaryMuscles.length) ? ` (+${ex.secondaryMuscles.slice(0,2).join(', ')})` : '';
    return `
      <div id="picker-row-${ex.id}" class="bg-bgCard border ${picked ? 'border-striveOrange bg-striveOrange/10' : 'border-white/15'} rounded-3xl p-2.5 flex items-center gap-3 transition">
        <div onclick="openExerciseDetailFromPicker(${ex.id})" class="cursor-pointer shrink-0" title="Podejrzyj GIF i opis">
          ${renderAnimatedExerciseThumb(ex, 'w-14 h-14')}
        </div>
        <div onclick="togglePickerExercise(${ex.id})" class="flex-1 min-w-0 cursor-pointer">
          <div class="flex justify-between items-start gap-2">
            <h3 class="font-semibold text-sm text-white truncate">${ex.name}</h3>
            <span id="picker-status-${ex.id}" class="text-xs ${picked ? 'text-striveOrange font-bold' : 'text-gray-400'}">${picked ? 'Wybrano ✓' : 'Wybierz'}</span>
          </div>
          <div class="flex justify-between items-center text-xs text-gray-400 mt-2">
            <span class="truncate">${ex.category} · ${ex.bodyPart}${secInfo}</span>
            <span onclick="event.stopPropagation(); openExerciseDetailFromPicker(${ex.id})" class="text-[10px] text-striveTeal underline shrink-0 ml-1">👁️ Podgląd</span>
          </div>
        </div>
      </div>`;
  }).join('');

  openModal(`
    <div class="flex justify-between items-center mb-3">
      <h2 class="text-lg font-bold">Wybierz Ćwiczenia (${filtered.length})</h2>
    </div>

    <div class="flex justify-between items-center mb-3">
      <button onclick="openCustomExerciseModal(true)" class="liquid-pill text-white font-bold text-xs px-4 py-2 rounded-2xl">Dodaj własne +</button>
      <button onclick="togglePickerSupersetMode()"
        class="liquid-pill text-white font-semibold text-xs px-3.5 py-2 rounded-2xl flex items-center gap-2">
        <span>Seria łączona</span>
        <span id="picker-superset-dot" class="w-4 h-4 rounded-full border-2 border-white flex items-center justify-center ${state.pickerSupersetMode ? 'bg-striveOrange' : ''}"></span>
      </button>
    </div>

    <div class="flex gap-2 mb-2.5">
      <input type="text" placeholder="🔍 Szukaj ćwiczenia..." value="${state.exerciseSearch}"
        oninput="state.exerciseSearch = this.value; state.exerciseDisplayLimit = 80; renderExercisePickerModal(false)"
        class="flex-1 bg-bgInput rounded-2xl px-3.5 py-2 text-sm">
    </div>

    <div class="grid grid-cols-2 gap-2 mb-3">
      <select onchange="state.exerciseFilterCat = this.value; state.exerciseDisplayLimit = 80; renderExercisePickerModal(false)" class="liquid-pill text-white font-semibold text-xs rounded-2xl px-3 py-2">
        <option value="ALL">Dowolna Kategoria</option>
        ${categories.filter(c => c !== 'ALL').map(c => `<option value="${c}" ${state.exerciseFilterCat === c ? 'selected' : ''}>${c}</option>`).join('')}
      </select>
      <select onchange="state.exerciseFilterPart = this.value; state.exerciseDisplayLimit = 80; renderExercisePickerModal(false)" class="liquid-pill text-white font-semibold text-xs rounded-2xl px-3 py-2">
        <option value="ALL">Dowolna Część Ciała</option>
        ${parts.filter(p => p !== 'ALL').map(p => `<option value="${p}" ${state.exerciseFilterPart === p ? 'selected' : ''}>${p}</option>`).join('')}
      </select>
    </div>

    <div id="picker-exercises-scroll" onscroll="state.pickerScrollTop = this.scrollTop" class="space-y-2 max-h-[52vh] overflow-y-auto pb-4">
      ${rowsHtml}
      ${filtered.length > state.exerciseDisplayLimit ? `
        <button onclick="state.exerciseDisplayLimit += 100; renderExercisePickerModal(true)" class="w-full liquid-pill text-white text-xs font-bold py-3 rounded-2xl mt-2">
          Pokaż więcej (${visible.length} z ${filtered.length})
        </button>
      ` : ''}
    </div>

    <div class="space-y-2 pt-2 border-t border-white/10">
      <button onclick="renderRoutineDraftModal(true)" class="w-full bg-white/10 text-white font-bold py-3 rounded-2xl text-sm">Powrót do rutyny</button>
      <button id="picker-confirm-btn" onclick="confirmPickerExercises()" class="w-full ${state.pickerSelectedIds.length ? 'liquid-orange-btn text-white' : 'bg-white/5 text-gray-500'} font-bold py-3 rounded-2xl text-sm transition">
        Zatwierdź wybrane (${state.pickerSelectedIds.length})
      </button>
    </div>
  `);

  const newScrollEl = document.getElementById('picker-exercises-scroll');
  if (newScrollEl && state.pickerScrollTop > 0) {
    newScrollEl.scrollTop = state.pickerScrollTop;
  }
}

function togglePickerSupersetMode() {
  state.pickerSupersetMode = !state.pickerSupersetMode;
  const dot = document.getElementById('picker-superset-dot');
  if (dot) {
    dot.className = `w-4 h-4 rounded-full border-2 border-white flex items-center justify-center ${state.pickerSupersetMode ? 'bg-striveOrange' : ''}`;
  }
}

function togglePickerExercise(exId) {
  const idx = state.pickerSelectedIds.indexOf(exId);
  let isPicked = false;
  if (idx >= 0) {
    state.pickerSelectedIds.splice(idx, 1);
    isPicked = false;
  } else {
    state.pickerSelectedIds.push(exId);
    isPicked = true;
  }

  const rowEl = document.getElementById(`picker-row-${exId}`);
  const statusEl = document.getElementById(`picker-status-${exId}`);
  const confirmBtn = document.getElementById('picker-confirm-btn');

  if (rowEl) {
    rowEl.className = `bg-bgCard border ${isPicked ? 'border-striveOrange bg-striveOrange/10' : 'border-white/15'} rounded-3xl p-2.5 flex items-center gap-3 transition`;
  }
  if (statusEl) {
    statusEl.className = `text-xs ${isPicked ? 'text-striveOrange font-bold' : 'text-gray-400'}`;
    statusEl.textContent = isPicked ? 'Wybrano ✓' : 'Wybierz';
  }
  if (confirmBtn) {
    const count = state.pickerSelectedIds.length;
    confirmBtn.className = `w-full ${count ? 'liquid-orange-btn text-white' : 'bg-white/5 text-gray-500'} font-bold py-3 rounded-2xl text-sm transition`;
    confirmBtn.textContent = `Zatwierdź wybrane (${count})`;
  }
}

function confirmPickerExercises() {
  if (!state.pickerSelectedIds.length) return;
  state.pickerSelectedIds.forEach(id => {
    state.routineDraft.exercises.push({
      exId: id,
      superset: state.pickerSupersetMode,
      setsList: [
        { type: 'N', reps: '8-10', weight: '' },
        { type: 'N', reps: '8-10', weight: '' },
        { type: 'N', reps: '8-10', weight: '' }
      ]
    });
  });
  renderRoutineDraftModal(true);
}

async function saveRoutineDraft() {
  const d = state.routineDraft;
  if (!d.name.trim()) return alert('Podaj nazwę rutyny');
  if (!d.exercises.length) return alert('Dodaj przynajmniej jedno ćwiczenie');

  const payload = {
    name: d.name.trim(),
    tag: d.tag.trim() || 'Własna',
    assignedDay: d.assignedDay || '',
    warmupRestSec: Number(d.warmupRestSec) || 60,
    workingRestSec: Number(d.workingRestSec) || 120,
    desc: d.desc.trim(),
    progression: d.progression || 'Podwójna progresja',
    exercises: d.exercises.map(ex => ({
      ...ex,
      sets: (ex.setsList || []).length
    }))
  };

  if (d.id) await db.routines.update(d.id, payload);
  else await db.routines.add(payload);

  state.routineDraft = null;
  closeModal();
  renderCurrentView();
}

async function startWorkout(routineId) {
  unlockIosAudioAndNotifications();
  const routine = await db.routines.get(routineId);
  if (!routine) return;
  const allExercises = await db.exercises.toArray();
  const exMap = Object.fromEntries(allExercises.map(e => [e.id, e]));

  const pastWorkouts = await db.workouts.toArray();
  pastWorkouts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

  const warmupRest = Number(routine.warmupRestSec) || 60;
  const workingRest = Number(routine.workingRestSec) || 120;

  const workoutExercises = (routine.exercises || []).map(item => {
    const exObj = item.isPlaceholder
      ? { id: 0, name: item.placeholderName, bodyPart: 'Klatka', isPlaceholder: true }
      : (exMap[item.exId] || { id: item.exId, name: 'Ćwiczenie', bodyPart: 'Klatka', slug: '0001' });

    let lastAllSets = [];
    if (!item.isPlaceholder) {
      for (const w of pastWorkouts) {
        const found = (w.exercises || []).find(e => Number(e.exId) === Number(item.exId));
        if (found && found.sets && found.sets.length) {
          lastAllSets = found.sets;
          break;
        }
      }
    }

    const lastWorkingSets = lastAllSets.filter(s => (s.type || 'N') === 'N');
    const lastWarmupSets = lastAllSets.filter(s => s.type === 'R');
    const lastDropSets = lastAllSets.filter(s => s.type === 'D');

    const templateSets = (item.setsList && item.setsList.length)
      ? item.setsList
      : Array.from({ length: item.sets || 3 }, () => ({ type: 'N', reps: item.repsRange || '8-10', weight: '' }));

    const plannedWorkingTemplates = templateSets.filter(t => (t.type || 'N') === 'N');
    const allWorkingHitMaxLastTime = lastWorkingSets.length >= plannedWorkingTemplates.length && plannedWorkingTemplates.every((wt, wIdx) => {
      const prevWork = lastWorkingSets[wIdx] || lastWorkingSets[lastWorkingSets.length - 1];
      const range = parseRepRange(wt.reps || '8-10');
      return prevWork && Number(prevWork.reps) >= range.max;
    });

    let workIdx = 0;
    let warmIdx = 0;
    let dropIdx = 0;

    const sets = templateSets.map((tmpl) => {
      const setType = tmpl.type || 'N';
      const range = parseRepRange(tmpl.reps || '8-10');

      if (setType !== 'N') {
        const prevPool = setType === 'R' ? lastWarmupSets : lastDropSets;
        const currPoolIdx = setType === 'R' ? warmIdx++ : dropIdx++;
        const prevSame = prevPool[currPoolIdx] || prevPool[prevPool.length - 1] || null;

        return {
          type: setType,
          repsRangeText: range.text,
          weight: prevSame ? prevSame.weight : (tmpl.weight || ''),
          reps: prevSame ? prevSame.reps : range.min,
          done: false,
          prevText: prevSame ? `${prevSame.weight}kg x ${prevSame.reps}` : '—',
          hintText: setType === 'R' ? `Rozgrzewka (${warmupRest}s)` : `Drop set (${warmupRest}s)`
        };
      }

      const prevWork = lastWorkingSets[workIdx] || lastWorkingSets[lastWorkingSets.length - 1] || null;
      workIdx++;

      const savedNextWeight = exObj.nextTargetWeight ? Number(exObj.nextTargetWeight) : null;

      if (!prevWork && !savedNextWeight) {
        return {
          type: 'N',
          repsRangeText: range.text,
          weight: tmpl.weight || '',
          reps: range.min,
          done: false,
          prevText: '—',
          hintText: `Cel: ${range.text} powt.`
        };
      }

      const prevDisplay = prevWork ? `${prevWork.weight}kg x ${prevWork.reps}` : '—';

      if (savedNextWeight) {
        return {
          type: 'N',
          repsRangeText: range.text,
          weight: savedNextWeight,
          reps: range.min,
          done: false,
          prevText: prevDisplay,
          hintText: `🔥 Nowy ciężar: ${savedNextWeight}kg x ${range.min}`
        };
      }

      if (allWorkingHitMaxLastTime) {
        const nextWeight = Number(prevWork.weight) + 2.5;
        return {
          type: 'N',
          repsRangeText: range.text,
          weight: nextWeight,
          reps: range.min,
          done: false,
          prevText: prevDisplay,
          hintText: `🔥 Progres: ${nextWeight}kg x ${range.min}`
        };
      }

      const nextReps = Math.min(range.max, Number(prevWork.reps) + 1);
      return {
        type: 'N',
        repsRangeText: range.text,
        weight: prevWork.weight,
        reps: nextReps,
        done: false,
        prevText: prevDisplay,
        hintText: `Cel: ${prevWork.weight}kg x ${nextReps}`
      };
    });

    return {
      exId: exObj.id,
      name: exObj.name,
      bodyPart: exObj.bodyPart,
      secondaryMuscles: exObj.secondaryMuscles || [],
      slug: exObj.slug,
      customGifUrl: exObj.customGifUrl,
      imageUrl: exObj.imageUrl,
      isPlaceholder: Boolean(item.isPlaceholder),
      superset: Boolean(item.superset),
      sets
    };
  });

  state.activeWorkout = {
    routineId: routine.id,
    routineName: routine.name,
    warmupRestSec: warmupRest,
    workingRestSec: workingRest,
    startTime: Date.now(),
    exercises: workoutExercises
  };

  persistActiveWorkoutState();
  document.getElementById('active-workout-bar').classList.remove('hidden');
  document.getElementById('bar-routine-name').textContent = routine.name;
  startGlobalWorkoutClock();
  openActiveWorkoutModal();
}

function discardActiveWorkout() {
  if (!confirm('Czy na pewno chcesz porzucić ten trening?')) return;
  state.activeWorkout = null;
  state.restTimerEnd = null;
  state.restTimerTotal = null;
  persistActiveWorkoutState();
  document.getElementById('active-workout-bar').classList.add('hidden');
  closeModal();
  renderCurrentView();
}

function cycleActiveWorkoutSetType(exIdx, sIdx) {
  const w = state.activeWorkout;
  const s = w.exercises[exIdx].sets[sIdx];
  s.type = nextSetType(s.type);
  s.autoWeight = false;
  if (s.type === 'R') s.hintText = `Rozgrzewka (${w.warmupRestSec}s)`;
  else if (s.type === 'D') s.hintText = `Drop set (${w.warmupRestSec}s)`;
  else s.hintText = `Cel (${s.repsRangeText || '8-10'})`;
  persistActiveWorkoutState();
  openActiveWorkoutModal(true);
}

function toggleSetDone(exIdx, sIdx) {
  unlockIosAudioAndNotifications();
  const w = state.activeWorkout;
  const s = w.exercises[exIdx].sets[sIdx];
  s.done = !s.done;
  if (s.done) {
    const isWarmup = s.type === 'R' || s.type === 'D';
    const sec = isWarmup ? (w.warmupRestSec || 60) : (w.workingRestSec || 120);
    const label = isWarmup ? 'Przerwa (Rozgrzewka)' : 'Przerwa (Seria robocza)';
    startRestTimer(sec, label);
  }
  persistActiveWorkoutState();
  openActiveWorkoutModal(true);
}

function addExtraSet(exIdx, setType = 'N') {
  const w = state.activeWorkout;
  const ex = w.exercises[exIdx];
  const reversed = [...ex.sets].reverse();
  const lastWorking = reversed.find(s => (s.type || 'N') === 'N') || null;
  const lastSame = reversed.find(s => (s.type || 'N') === setType) || null;
  const rangeText = (lastWorking && lastWorking.repsRangeText) || '8-10';

  // Ciężar kopiujemy wyłącznie między seriami roboczymi – R i D nigdy nie mieszają się z roboczymi
  let weight = '';
  let reps = 8;
  let autoWeight = false;
  if (setType === 'N') {
    weight = lastWorking ? lastWorking.weight : '';
    reps = lastWorking ? lastWorking.reps : 8;
    autoWeight = weight !== '' && weight !== null && weight !== undefined;
  } else {
    reps = lastSame ? lastSame.reps : (setType === 'D' && lastWorking ? lastWorking.reps : 8);
  }

  ex.sets.push({
    type: setType,
    repsRangeText: rangeText,
    weight,
    reps,
    done: false,
    autoWeight,
    prevText: '—',
    hintText: setType === 'R' ? `Rozgrzewka (${w.warmupRestSec}s)` : (setType === 'D' ? `Drop set (${w.warmupRestSec}s)` : `Cel (${rangeText})`)
  });
  persistActiveWorkoutState();
  openActiveWorkoutModal(true);
}

async function swapExerciseInFlight(exIdx, bodyPart) {
  const all = await db.exercises.toArray();
  const alternatives = all.slice(0, 40);
  const names = alternatives.map((a, i) => `${i + 1}. ${a.name} (${a.category})`).join('\n');
  const choice = prompt(`Wybierz numer ćwiczenia:\n\n${names}`);
  const idx = parseInt(choice) - 1;
  if (!isNaN(idx) && alternatives[idx]) {
    const picked = alternatives[idx];
    state.activeWorkout.exercises[exIdx].exId = picked.id;
    state.activeWorkout.exercises[exIdx].name = picked.name;
    state.activeWorkout.exercises[exIdx].bodyPart = picked.bodyPart;
    state.activeWorkout.exercises[exIdx].secondaryMuscles = picked.secondaryMuscles || [];
    state.activeWorkout.exercises[exIdx].slug = picked.slug;
    state.activeWorkout.exercises[exIdx].customGifUrl = picked.customGifUrl;
    state.activeWorkout.exercises[exIdx].isPlaceholder = false;
    persistActiveWorkoutState();
    openActiveWorkoutModal(true);
  }
}

function prepareWorkoutSummaryModal() {
  const w = state.activeWorkout;
  if (!w) return;

  let totalSets = 0;
  let totalWorkingSets = 0;
  let totalVolume = 0;
  const cleanedExercises = [];
  const progressions = [];

  w.exercises.forEach(ex => {
    const doneSets = ex.sets.filter(s => s.done && (Number(s.weight) > 0 || Number(s.reps) > 0));
    const usedSets = doneSets.length ? doneSets : ex.sets.filter(s => Number(s.weight) > 0 || Number(s.reps) > 0);

    usedSets.forEach(s => {
      totalSets++;
      if ((s.type || 'N') === 'N') totalWorkingSets++;
      totalVolume += (Number(s.weight) || 0) * (Number(s.reps) || 0);
    });

    if (usedSets.length) {
      cleanedExercises.push({
        exId: ex.exId,
        name: ex.name,
        bodyPart: ex.bodyPart || 'Klatka',
        secondaryMuscles: ex.secondaryMuscles || [],
        sets: usedSets.map(s => ({
          type: s.type || 'N',
          weight: Number(s.weight) || 0,
          reps: Number(s.reps) || 0,
          repsRangeText: s.repsRangeText || '8-10'
        }))
      });

      const workingUsed = usedSets.filter(s => (s.type || 'N') === 'N');
      if (workingUsed.length > 0 && ex.exId) {
        const hitLimitAll = workingUsed.every(ws => {
          const parsed = parseRepRange(ws.repsRangeText || '8-10');
          return Number(ws.reps) >= parsed.max;
        });

        const topWorkingWeight = Math.max(...workingUsed.map(ws => Number(ws.weight) || 0));
        const sampleRange = parseRepRange(workingUsed[0].repsRangeText || '8-10');

        if (hitLimitAll && topWorkingWeight > 0) {
          progressions.push({
            exId: ex.exId,
            name: ex.name,
            currentWeight: topWorkingWeight,
            achievedRepsText: workingUsed.map(ws => `${ws.weight}kg×${ws.reps}`).join(', '),
            limitMax: sampleRange.max,
            proposedWeight: topWorkingWeight + 2.5
          });
        }
      }
    }
  });

  const durationMin = Math.max(1, Math.round((Date.now() - w.startTime) / 60000));

  state.pendingSummary = {
    date: toLocalIso(new Date()),
    timestamp: Date.now(),
    routineId: w.routineId,
    routineName: w.routineName,
    durationMin,
    totalSets,
    totalWorkingSets,
    totalVolume: Math.round(totalVolume),
    exercises: cleanedExercises,
    progressions
  };

  renderWorkoutSummaryModal();
}

function adjustProposedWeight(idx, delta) {
  const p = state.pendingSummary.progressions[idx];
  p.proposedWeight = Math.max(0, Number(p.proposedWeight) + delta);
  renderWorkoutSummaryModal();
}

async function confirmAndSaveWorkoutSummary() {
  const sum = state.pendingSummary;
  if (!sum) return;

  await db.workouts.add({
    date: sum.date,
    timestamp: sum.timestamp,
    routineId: sum.routineId,
    routineName: sum.routineName,
    durationMin: sum.durationMin,
    totalSets: sum.totalSets,
    totalVolume: sum.totalVolume,
    exercises: sum.exercises
  });

  const progressedIds = new Set();
  for (const prog of sum.progressions) {
    if (prog.exId && prog.proposedWeight > 0) {
      progressedIds.add(prog.exId);
      const dbEx = await db.exercises.get(prog.exId);
      if (dbEx) {
        await db.exercises.update(prog.exId, {
          nextTargetWeight: prog.proposedWeight,
          sessions: (dbEx.sessions || 0) + 1
        });
      }
    }
  }

  for (const ex of sum.exercises) {
    if (ex.exId && !progressedIds.has(ex.exId)) {
      const dbEx = await db.exercises.get(ex.exId);
      if (dbEx) {
        await db.exercises.update(ex.exId, {
          nextTargetWeight: null,
          sessions: (dbEx.sessions || 0) + 1
        });
      }
    }
  }

  const activePlan = await db.plans.where('active').equals(1).first();
  if (activePlan) {
    await db.plans.update(activePlan.id, { nextIndex: (activePlan.nextIndex || 0) + 1 });
  }

  state.activeWorkout = null;
  state.pendingSummary = null;
  state.restTimerEnd = null;
  state.restTimerTotal = null;
  state.selectedTodayRoutineId = null;
  persistActiveWorkoutState();
  document.getElementById('active-workout-bar').classList.add('hidden');
  closeModal();
  navigate('home');
}

function copyCoachReportText() {
  const area = document.getElementById('coach-report-area');
  if (!area) return;
  navigator.clipboard.writeText(area.value).then(() => {
    alert('Raport dla trenera został skopiowany do schowka!');
  }).catch(() => {
    area.select();
    document.execCommand('copy');
    alert('Raport skopiowany!');
  });
}

async function attachPhotoToMeasurementDraft(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  for (const file of files) {
    const dataUrl = await compressImageFileToDataUrl(file);
    state.tempMeasurementPhotos.push(dataUrl);
  }
  renderMeasurementsModalContent();
}

async function saveMeasurement() {
  const wVal = parseFloat(document.getElementById('m-weight').value);
  if (!wVal) return alert('Podaj przynajmniej aktualną wagę w kg');
  const todayIso = toLocalIso(new Date());
  const photosCopy = [...state.tempMeasurementPhotos];

  const mId = await db.measurements.add({
    date: todayIso,
    weight: wVal,
    chest: parseFloat(document.getElementById('m-chest').value) || 0,
    waist: parseFloat(document.getElementById('m-waist').value) || 0,
    bicepsL: parseFloat(document.getElementById('m-bicL').value) || 0,
    bicepsR: parseFloat(document.getElementById('m-bicR').value) || 0,
    forearmL: parseFloat(document.getElementById('m-forL').value) || 0,
    forearmR: parseFloat(document.getElementById('m-forR').value) || 0,
    thighL: parseFloat(document.getElementById('m-thiL').value) || 0,
    thighR: parseFloat(document.getElementById('m-thiR').value) || 0,
    calfL: parseFloat(document.getElementById('m-calL').value) || 0,
    calfR: parseFloat(document.getElementById('m-calR').value) || 0,
    photos: photosCopy
  });

  for (const dataUrl of photosCopy) {
    await db.photos.add({ date: todayIso, weight: wVal, measurementId: mId, dataUrl });
  }

  state.tempMeasurementPhotos = [];
  closeModal();
  renderCurrentView();
}

async function renderCalendarView() {
  const workouts = await db.workouts.toArray();
  workouts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

  const itemsHtml = workouts.map(w => {
    const exSummary = (w.exercises || []).map(e => {
      const workingSets = (e.sets || []).filter(s => (s.type || 'N') === 'N');
      const pool = workingSets.length ? workingSets : (e.sets || []);
      const best = pool.reduce((m, s) => (s.weight > m.weight ? s : m), { weight: 0, reps: 0 });
      return `<div class="flex justify-between text-xs py-0.5 text-gray-300"><span>${e.name}</span><span class="font-mono text-striveTeal">Top: ${best.weight}kg x ${best.reps}</span></div>`;
    }).join('');

    return `
      <div onclick="openPastWorkoutDetailModal(${w.id})" class="bg-bgCard rounded-3xl p-4 mb-3 cursor-pointer active:scale-[0.99] transition">
        <div class="flex justify-between items-center mb-2 border-b border-white/10 pb-2">
          <div><h3 class="font-bold text-base text-white">${w.routineName}</h3><span class="text-xs text-gray-400">📅 ${w.date} · Dotknij po mapę mięśni 🧬</span></div>
          <div class="text-right text-xs text-striveOrange font-bold"><div>∑ ${w.totalVolume} kg</div><div class="text-gray-400 font-normal">${w.durationMin} min · ${w.totalSets} serii</div></div>
        </div>
        <div class="space-y-0.5">${exSummary}</div>
      </div>`;
  }).join('');

  return `<div class="text-center pt-1 mb-4"><h1 class="text-lg font-bold">Historia Treningów</h1></div>${itemsHtml || '<p class="text-center text-xs text-gray-400 py-12">Brak zapisanych sesji treningowych.</p>'}`;
}

async function openPastWorkoutDetailModal(workoutId) {
  const w = await db.workouts.get(workoutId);
  if (!w) return;
  const allEx = await db.exercises.toArray();
  const exMap = Object.fromEntries(allEx.map(e => [e.id, e]));

  const enrichedExercises = (w.exercises || []).map(ex => ({
    ...ex,
    bodyPart: ex.bodyPart || (exMap[ex.exId] ? exMap[ex.exId].bodyPart : 'Klatka'),
    secondaryMuscles: (ex.secondaryMuscles && ex.secondaryMuscles.length) ? ex.secondaryMuscles : (exMap[ex.exId] ? exMap[ex.exId].secondaryMuscles : [])
  }));

  const setsHtml = enrichedExercises.map(ex => {
    const badges = (ex.sets || []).map(s => `<span class="inline-block bg-bgInput rounded-xl px-2.5 py-1 text-[11px] font-mono mr-1 mb-1">${s.type === 'R' ? '[R] ' : (s.type === 'D' ? '[D] ' : '')}${s.weight}kg x ${s.reps}</span>`).join('');
    return `<div class="py-2 border-b border-white/10 last:border-none"><div class="text-xs font-bold text-white mb-1">${ex.name}</div><div>${badges}</div></div>`;
  }).join('');

  openModal(`
    <div class="flex justify-between items-center mb-4">
      <button onclick="closeModal()" class="text-2xl">✕</button>
      <div class="text-center">
        <h2 class="text-base font-bold">${w.routineName}</h2>
        <span class="text-xs text-gray-400">${w.date} · ${w.durationMin} min · ${w.totalVolume} kg</span>
      </div>
      <div class="w-6"></div>
    </div>
    ${renderAnatomicalMuscleMap(enrichedExercises, '🧬 Mapa Mięśni z tego treningu', false)}
    <div class="bg-bgCard rounded-3xl p-4">${setsHtml}</div>
  `);
}
