<script>
const DAYS_SHORT = ['pon.', 'wt.', 'śr.', 'czw.', 'pt.', 'sob.', 'niedz.'];

// Zmieniono wersję bazy na v10, aby wymusić odświeżenie danych i pobranie poprawnych ścieżek
const db = new Dexie('gymWK_GlobalPlan_v10');
db.version(1).stores({
  exercises: '++id, name, category, bodyPart, slug, nextTargetWeight',
  routines: '++id, name, tag, assignedDay',
  plans: '++id, name, active',
  workouts: '++id, date, timestamp, routineId, routineName',
  measurements: '++id, date, weight',
  photos: '++id, date, weight, measurementId',
  settings: 'key'
});

let state = {
  tab: 'home',
  hubSubTab: 'plans',
  activeWorkout: null,
  pendingSummary: null,
  restTimerEnd: null,
  restTimerLabel: 'Przerwa',
  timerInterval: null,
  wizardPlan: null,
  routineDraft: null,
  pickerSelectedIds: [],
  pickerSupersetMode: false,
  selectedTodayRoutineId: null,
  tempMeasurementPhotos: [],
  exerciseFilterCat: 'ALL',
  exerciseFilterPart: 'ALL',
  exerciseSearch: ''
};

function checkIosStandaloneMode() {
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const dismissed = localStorage.getItem('gymWK_hide_pwa_hint') === '1';
  const hintEl = document.getElementById('ios-pwa-hint');
  if (!isStandalone && !dismissed && hintEl) hintEl.classList.remove('hidden');
}

function dismissPwaHint() {
  localStorage.setItem('gymWK_hide_pwa_hint', '1');
  const hintEl = document.getElementById('ios-pwa-hint');
  if (hintEl) hintEl.classList.add('hidden');
}

function toLocalIso(dateObj = new Date()) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  const d = String(dateObj.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function formatDayMonth(dateObj) {
  const d = String(dateObj.getDate()).padStart(2, '0');
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  return `${d}.${m}`;
}

function parseRepRange(rangeStr) {
  const clean = String(rangeStr || '8-10').trim();
  const match = clean.match(/(\d+)\s*[-–/]\s*(\d+)/);
  if (match) {
    const min = parseInt(match[1], 10);
    const max = parseInt(match[2], 10);
    return { min: Math.min(min, max), max: Math.max(min, max), text: `${min}-${max}` };
  }
  const single = parseInt(clean, 10) || 10;
  return { min: single, max: single, text: `${single}` };
}

function getSetBadgeInfo(setsArray, currentIndex) {
  const current = setsArray[currentIndex];
  const type = current.type || 'N';
  if (type === 'R') return { label: 'R', isWorking: false, classes: 'bg-striveOrange/20 text-striveOrange border border-striveOrange/60' };
  if (type === 'D') return { label: 'D', isWorking: false, classes: 'bg-purple-500/20 text-purple-300 border border-purple-400/50' };
  let workingNumber = 0;
  for (let i = 0; i <= currentIndex; i++) {
    if ((setsArray[i].type || 'N') === 'N') workingNumber++;
  }
  return { label: String(workingNumber), isWorking: true, workIdx: workingNumber - 1, classes: 'bg-striveTeal/25 text-white border border-striveTeal/60' };
}

function nextSetType(currentType) {
  if (!currentType || currentType === 'N') return 'R';
  if (currentType === 'R') return 'D';
  return 'N';
}

// Funkcja renderująca miniaturkę / GIF bezpośrednio z Twojego repozytorium GitHub
function renderAnimatedExerciseThumb(ex, sizeClass = 'w-14 h-14') {
  if (!ex || ex.isPlaceholder) {
    return `<div class="${sizeClass} rounded-2xl bg-striveTealDark/60 border border-striveTeal/50 flex items-center justify-center shrink-0 text-xs font-bold text-striveTeal">?</div>`;
  }
  const primarySrc = ex.customGifUrl || ex.imageUrl;
  const fallbackSrc = ex.imageUrl || ex.customGifUrl;

  if (primarySrc) {
    return `
      <div class="${sizeClass} rounded-2xl bg-white flex items-center justify-center shrink-0 overflow-hidden border border-white/25 shadow-inner">
        <img src="${primarySrc}" alt="${ex.name || 'Ćwiczenie'}" loading="lazy"
          onerror="if(this.src !== '${fallbackSrc}'){this.src='${fallbackSrc}';}else{this.style.display='none';}"
          class="w-full h-full object-cover bg-white" />
      </div>`;
  }

  return `<div class="${sizeClass} rounded-2xl bg-striveTealDark/60 border border-striveTeal/50 flex items-center justify-center shrink-0 text-xs font-bold text-striveTeal">🏋️</div>`;
}

function compressImageFileToDataUrl(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxW = 800;
        const scale = Math.min(1, maxW / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function translateEquipmentToPolish(equipment) {
    const equipmentMap = {
        "body weight": "Masa ciała", "barbell": "Sztanga", "dumbbell": "Hantle",
        "cable": "Wyciąg", "kettlebell": "Kettlebell", "band": "Taśma oporowa",
        "weighted": "Obciążenie", "stability ball": "Piłka gimnastyczna",
        "ez barbell": "Sztanga EZ", "leverage machine": "Maszyna",
        "smith machine": "Suwnica Smitha", "assisted": "Wspomagane", "medicine ball": "Piłka lekarska"
    };
    return equipmentMap[equipment] || equipment;
}

function translateTargetToPolish(target) {
    const targetMap = {
        "abs": "Brzuch", "waist": "Pas", "pectorals": "Klatka", "biceps": "Bicepsy",
        "glutes": "Pośladki", "delts": "Barki", "triceps": "Tricepsy", "upper back": "Plecy",
        "lats": "Najszerszy grzbietu", "calves": "Łydki", "quads": "Czworogłowe ud",
        "forearms": "Przedramiona", "hamstrings": "Dwugłowe ud"
    };
    return targetMap[target] || target;
}

// Inicjalizacja bazy danych i pobieranie ćwiczeń z exercises.json z uwzględnieniem GitHub RAW
async function initCatalogOnly() {
  const exCount = await db.exercises.count();
  if (exCount > 0) return;

  const REPO_RAW = 'https://raw.githubusercontent.com/kulaczekkkk/exercises-dataset/main';
  let catalog = [];
  try {
    let response = await fetch('data/exercises.json').catch(() => null);
    let useRemoteRaw = false;

    if (!response || !response.ok) {
      response = await fetch(`${REPO_RAW}/data/exercises.json`);
      useRemoteRaw = true;
    }
    if (!response.ok) throw new Error('Failed to load exercises');
    const exercisesData = await response.json();

    catalog = exercisesData.map(ex => {
      const category = translateEquipmentToPolish(ex.equipment || '');
      const bodyPart = translateTargetToPolish(ex.target || '');
      const name = ex.name || 'Unknown Exercise';

      let tip = 'Wykonaj ćwiczenie zgodnie z techniką.';
      if (ex.instructions) {
        if (ex.instructions.pl && typeof ex.instructions.pl === 'string' && ex.instructions.pl.trim() !== '') {
          tip = ex.instructions.pl;
        } else if (ex.instructions.en && typeof ex.instructions.en === 'string' && ex.instructions.en.trim() !== '') {
          tip = ex.instructions.en;
        }
      }

      const slug = ex.id || ex.slug || name.toLowerCase().replace(/[^a-z0-9]+/g, '_');

      // Bezpośrednie i niezawodne mapowanie ścieżek z Twojego repozytorium GitHub
      const rawGif = ex.gif_url || '';
      const rawImg = ex.image || '';

      const customGifUrl = rawGif
        ? (rawGif.startsWith('http') ? rawGif : `${REPO_RAW}/${rawGif.replace(/^\.?\//, '')}`)
        : '';

      const imageUrl = rawImg
        ? (rawImg.startsWith('http') ? rawImg : `${REPO_RAW}/${rawImg.replace(/^\.?\//, '')}`)
        : '';

      return {
        slug,
        name,
        category,
        bodyPart,
        sessions: 0,
        tip,
        customGifUrl,
        imageUrl
      };
    });
  } catch (error) {
    console.error('Error loading exercises from JSON:', error);
    catalog = [
      { slug: 'Pushup', name: 'Pompki', category: 'Masa ciała', bodyPart: 'Klatka', sessions: 0, tip: 'Ustaw ręce nieco szerzej niż barki.' },
      { slug: 'Bodyweight_Squat', name: 'Przysiady', category: 'Masa ciała', bodyPart: 'Czworogłowe ud', sessions: 0, tip: 'Stopy na szerokość bioder.' }
    ];
  }

  await db.exercises.bulkAdd(catalog);
}

function navigate(tabName) {
  state.tab = tabName;
  document.querySelectorAll('nav button').forEach(btn => {
    btn.classList.remove('text-striveOrange');
    btn.classList.add('text-gray-300');
    const dot = btn.querySelector('.nav-dot');
    if (dot) dot.classList.add('hidden');
  });
  const activeBtn = document.getElementById('nav-' + tabName);
  if (activeBtn) {
    activeBtn.classList.remove('text-gray-300');
    activeBtn.classList.add('text-striveOrange');
    const dot = activeBtn.querySelector('.nav-dot');
    if (dot) dot.classList.remove('hidden');
  }

  const subnav = document.getElementById('workout-subnav');
  if (tabName === 'hub') {
    subnav.classList.remove('hidden');
    updateSubNavHighlight();
  } else {
    subnav.classList.add('hidden');
  }

  renderCurrentView();
}

function switchWorkoutSubTab(sub) {
  state.hubSubTab = sub;
  updateSubNavHighlight();
  renderCurrentView();
}

function updateSubNavHighlight() {
  ['plans', 'routines', 'exercises'].forEach(s => {
    const el = document.getElementById('subtab-' + s);
    if (state.hubSubTab === s) {
      el.className = 'py-2 rounded-xl liquid-pill text-white font-bold shadow transition';
    } else {
      el.className = 'py-2 rounded-xl text-gray-300 transition';
    }
  });
}

async function renderCurrentView() {
  const container = document.getElementById('app-content');
  if (state.tab === 'home') container.innerHTML = await renderHomeView();
  else if (state.tab === 'hub') {
    if (state.hubSubTab === 'plans') container.innerHTML = await renderPlansView();
    else if (state.hubSubTab === 'routines') container.innerHTML = await renderRoutinesView();
    else if (state.hubSubTab === 'exercises') container.innerHTML = await renderExercisesView();
  }
  else if (state.tab === 'profile') container.innerHTML = await renderProfileView();
  else if (state.tab === 'calendar') container.innerHTML = await renderCalendarView();
}

async function renderHomeView() {
  const workouts = await db.workouts.toArray();
  workouts.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
  const measurements = await db.measurements.orderBy('date').toArray();
  const routines = await db.routines.toArray();
  const activePlan = await db.plans.where('active').equals(1).first();
  const noteObj = await db.settings.get('stickyNote');
  const stickyText = noteObj ? noteObj.value : 'Naciśnij aby edytować tekst';

  const latestWeight = measurements.length ? `${measurements[measurements.length - 1].weight} kg` : 'Brak wpisu';

  return `
    <div class="flex justify-between items-center mb-3.5 pt-1">
      <span class="text-xs text-gray-400 font-mono bg-white/5 px-2.5 py-1 rounded-full border border-white/10">${toLocalIso(new Date())}</span>
      <h1 class="text-xl font-extrabold tracking-tight">gym<span class="text-striveOrange">WK</span></h1>
      <button onclick="openQuickStartModal()" class="liquid-pill text-white text-xs font-bold px-3.5 py-1.5 rounded-full active:scale-95 transition">Trenuj</button>
    </div>

    <div onclick="navigate('profile'); setTimeout(()=>openMeasurementsModal(),100)" class="bg-bgCard rounded-3xl p-4 mb-3 relative overflow-hidden cursor-pointer active:scale-[0.99] transition">
      <div><span class="liquid-orange-btn text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full">Waga i Sylwetka</span></div>
      <div class="text-right mt-2">
        <div class="text-2xl font-extrabold text-white tracking-tight">${latestWeight}</div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div onclick="editStickyNote()" class="liquid-pill rounded-3xl p-3.5 flex flex-col justify-between min-h-[120px] cursor-pointer active:scale-[0.98] transition">
        <p class="text-sm text-white/95 font-medium leading-snug break-words">${stickyText}</p>
        <span class="text-[10px] text-white/70 text-right mt-2">✎ Notatka</span>
      </div>
      <div class="grid grid-cols-2 gap-2.5">
        <div class="bg-bgCard rounded-3xl p-2 flex flex-col items-center justify-center">
          <span class="text-lg">🔥</span>
          <span class="text-xl font-extrabold mt-0.5">${workouts.length}</span>
          <span class="text-[10px] text-gray-400 text-center">Łącznie</span>
        </div>
        <div class="bg-bgCard rounded-3xl p-2 flex flex-col items-center justify-center">
          <span class="text-lg">📌</span>
          <span class="text-xl font-extrabold mt-0.5">${routines.length}</span>
          <span class="text-[10px] text-gray-400 text-center">Rutyn</span>
        </div>
      </div>
    </div>
  `;
}

async function editStickyNote() {
  const noteObj = await db.settings.get('stickyNote');
  const nextVal = prompt('Wpisz tekst na karteczkę:', noteObj ? noteObj.value : '');
  if (nextVal !== null) {
    await db.settings.put({ key: 'stickyNote', value: nextVal || 'Naciśnij aby edytować tekst' });
    renderCurrentView();
  }
}

async function renderPlansView() {
  const plans = await db.plans.toArray();
  const activePlan = plans.find(p => p.active === 1) || plans[0];
  const routines = await db.routines.toArray();

  if (!activePlan) {
    return `
      <div class="text-center py-14 px-4 bg-bgCard rounded-3xl mt-2">
        <h2 class="text-xl font-bold mb-2">Brak aktywnego planu</h2>
        <p class="text-xs text-gray-300 mb-6">Utwórz rutyny i połącz je w plan.</p>
        <button onclick="openPlanWizard()" class="liquid-orange-btn text-white font-bold text-xs px-5 py-3 rounded-2xl">+ Utwórz Plan</button>
      </div>`;
  }

  return `
    <div class="flex justify-between items-center mb-4 pt-1">
      <h1 class="text-lg font-bold">Aktywny Plan</h1>
      <button onclick="openPlanWizard()" class="liquid-pill text-white text-xs font-bold px-3.5 py-1.5 rounded-full">+ Nowy</button>
    </div>
    <div class="bg-bgCard rounded-3xl p-4 mb-4">
      <h2 class="text-2xl font-extrabold mb-1">${activePlan.name}</h2>
    </div>
  `;
}

async function renderRoutinesView() {
  const routines = await db.routines.toArray();
  const exercises = await db.exercises.toArray();
  const exMap = Object.fromEntries(exercises.map(e => [e.id, e]));

  const cardsHtml = routines.map(r => `
    <div class="bg-bgCard rounded-3xl p-3.5 flex flex-col justify-between mb-3">
      <div>
        <h3 class="font-bold text-sm mb-1">${r.name}</h3>
      </div>
      <button onclick="startWorkout(${r.id})" class="w-full liquid-orange-btn text-white text-xs font-bold py-2.5 rounded-2xl mt-2">Trenuj</button>
    </div>`).join('');

  return `
    <div class="flex justify-between items-center mb-4 pt-1">
      <h1 class="text-lg font-bold">Rutyny</h1>
      <button onclick="openRoutineCreatorModal()" class="liquid-orange-btn text-white text-xs font-bold px-3.5 py-1.5 rounded-full">Dodaj +</button>
    </div>
    ${routines.length ? cardsHtml : '<p class="text-center text-xs text-gray-400 py-10">Brak rutyn.</p>'}
  `;
}

async function openRoutineCreatorModal() {
  state.routineDraft = { name: '', exercises: [] };
  openModal(`
    <div class="flex justify-between items-center mb-5">
      <button onclick="closeModal()" class="text-2xl">✕</button>
      <h2 class="text-lg font-bold">Nowa Rutyna</h2>
      <div class="w-6"></div>
    </div>
    <input type="text" id="draft-routine-name" placeholder="Nazwa rutyny..." class="w-full bg-bgInput rounded-2xl p-3 text-sm mb-4">
    <button onclick="saveRoutineDraft()" class="w-full liquid-orange-btn text-white font-bold py-3 rounded-2xl">Zapisz rutynę</button>
  `);
}

async function saveRoutineDraft() {
  const name = document.getElementById('draft-routine-name').value.trim();
  if (!name) return alert('Podaj nazwę');
  await db.routines.add({ name, exercises: [] });
  state.routineDraft = null;
  closeModal();
  renderCurrentView();
}

async function renderExercisesView() {
  const allEx = await db.exercises.toArray();
  const filtered = allEx.filter(e => e.name.toLowerCase().includes(state.exerciseSearch.toLowerCase()));

  const listHtml = filtered.map(ex => `
    <div onclick="openExerciseDetailModal(${ex.id})" class="bg-bgCard rounded-3xl p-2.5 flex items-center gap-3 cursor-pointer active:scale-[0.99] transition mb-2">
      ${renderAnimatedExerciseThumb(ex, 'w-14 h-14')}
      <div class="flex-1 min-w-0">
        <h3 class="font-semibold text-sm text-white truncate">${ex.name}</h3>
        <div class="text-xs text-gray-400 mt-1">${ex.category} · ${ex.bodyPart}</div>
      </div>
    </div>`).join('');

  return `
    <div class="flex justify-between items-center mb-3 pt-1">
      <h1 class="text-lg font-bold">Ćwiczenia (${allEx.length})</h1>
    </div>
    <input type="text" placeholder="🔍 Szukaj ćwiczenia..." value="${state.exerciseSearch}"
      oninput="state.exerciseSearch = this.value; renderCurrentView()"
      class="w-full bg-bgInput rounded-2xl px-3.5 py-2.5 text-sm text-white mb-3">
    <div class="space-y-2">${listHtml}</div>
  `;
}

async function openExerciseDetailModal(exId) {
  const ex = await db.exercises.get(exId);
  if (!ex) return;

  openModal(`
    <div class="flex justify-between items-center mb-4">
      <button onclick="closeModal()" class="text-2xl text-gray-300">✕</button>
      <h2 class="font-bold text-base truncate px-2">${ex.name}</h2>
      <div class="w-6"></div>
    </div>

    <div class="bg-white rounded-3xl p-4 flex flex-col items-center justify-center mb-4 relative overflow-hidden">
      <span class="text-[10px] font-bold uppercase text-gray-500 mb-1">Animacja / Podgląd</span>
      ${renderAnimatedExerciseThumb(ex, 'w-56 h-56')}
      <span class="text-xs font-semibold text-gray-700 mt-2">Sprzęt: ${ex.category} · Partia: ${ex.bodyPart}</span>
    </div>

    <div class="bg-bgCard rounded-3xl p-4">
      <h3 class="text-xs font-bold uppercase text-striveOrange mb-1">Wskazówka</h3>
      <p class="text-sm text-gray-200 leading-relaxed">${ex.tip || 'Brak dodatkowych wskazówek.'}</p>
    </div>
  `);
}

async function openQuickStartModal() {
  const routines = await db.routines.toArray();
  openModal(`
    <div class="flex justify-between items-center mb-2">
      <button onclick="closeModal()" class="text-2xl">✕</button>
      <h2 class="text-lg font-bold">Wybierz trening</h2>
      <div class="w-6"></div>
    </div>
    ${routines.length ? routines.map(r => `<button onclick="startWorkout(${r.id})" class="w-full liquid-orange-btn text-white font-bold py-3 rounded-2xl mb-2">${r.name}</button>`).join('') : '<p class="text-center text-xs text-gray-400 py-6">Najpierw stwórz rutynę.</p>'}
  `);
}

async function startWorkout(routineId) {
  const routine = await db.routines.get(routineId);
  if (!routine) return;
  state.activeWorkout = { routineName: routine.name, startTime: Date.now(), exercises: [] };
  document.getElementById('active-workout-bar').classList.remove('hidden');
  document.getElementById('bar-routine-name').textContent = routine.name;
  closeModal();
}

async function renderProfileView() {
  return `
    <div class="text-center pt-1 mb-5">
      <h1 class="text-lg font-bold">Profil</h1>
    </div>
    <div class="bg-bgCard rounded-3xl divide-y divide-white/10">
      <button onclick="clearAllUserData()" class="w-full p-4 flex items-center justify-between text-sm font-medium text-red-400">
        <span>🗑 Reset danych</span><span>›</span>
      </button>
    </div>
  `;
}

async function clearAllUserData() {
  if (!confirm('Czy na pewno wyczyścić dane?')) return;
  await db.delete();
  window.location.reload();
}

async function renderCalendarView() {
  return `<div class="text-center pt-1 mb-4"><h1 class="text-lg font-bold">Historia</h1></div><p class="text-center text-xs text-gray-400 py-12">Brak wpisów.</p>`;
}

function openPlanWizard() {
  openModal(`
    <div class="flex justify-between items-center mb-4">
      <button onclick="closeModal()" class="text-xl">✕</button>
      <h2 class="text-lg font-bold">Nowy Plan</h2>
    </div>
    <input type="text" id="w-name" placeholder="Nazwa planu..." class="w-full bg-bgInput rounded-2xl p-3 text-sm mb-4">
    <button onclick="savePlanFromWizard()" class="w-full liquid-orange-btn text-white font-bold py-3.5 rounded-3xl">Zapisz</button>
  `);
}

async function savePlanFromWizard() {
  const name = document.getElementById('w-name').value.trim() || 'Mój Plan';
  await db.plans.add({ name, active: 1 });
  closeModal();
  renderCurrentView();
}

function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

window.addEventListener('DOMContentLoaded', async () => {
  checkIosStandaloneMode();
  await initCatalogOnly();
  navigate('home');
});
</script>
</body>
</html>
